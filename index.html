async function previewImport(file){try{if(!file)return;if(file.size>15*1024*1024)throw Error('Maximum backup size is 15 MB.');pendingImport=validateData(JSON.parse(await file.text()));$('importPreview').innerHTML=`<div class="notice">Validated: ${pendingImport.lots.length} purchases, ${pendingImport.sales.length} sales and ${pendingImport.dividends.length} income entries.</div><p class="muted">Restore replaces the portfolio on this device. Export your current portfolio first if you want to keep both.</p><div class="form-actions"><button data-action="backup">Export current backup</button><button class="primary" data-action="restore">Replace with this backup</button></div>`;}catch(e){pendingImport=null;formError(e);}}
function settingsSheet(){openModal('Your workspace',`<form id="settingsForm"><div class="stack">${section('Appearance & goals',`<div class="form-grid"><label class="field">Theme<select name="theme"><option value="dark" ${cfg.theme==='dark'?'selected':''}>Midnight</option><option value="light" ${cfg.theme==='light'?'selected':''}>Daylight</option></select></label>${field('target','Portfolio goal (INR)',cfg.target,'number','min="1" step="any"')}${field('targetDate','Target date (optional)',cfg.targetDate,'date')}</div>`)}${section('Price settings',`<div class="form-grid">${field('usd','Reference USD/INR',cfg.usd||'','number','min="0.000001" step="any"')}${field('goldDuty','Gold premium / duty assumption (%)',cfg.goldDuty,'number','min="0" max="100" step=".01"')}${field('silverDuty','Silver premium / duty assumption (%)',cfg.silverDuty,'number','min="0" max="100" step=".01"')}</div><p class="footnote">FX source date: ${esc(cfg.usdDate||'Manual / not fetched')}. Metal conversion: USD per troy ounce × USD/INR ÷ 31.1034768 × (1 + assumption/100). Enter your own premium; no tax rate is presumed. This is not an Indian retail quote.</p>`)}${section('Optional cloud sync & stock prices',`<p class="muted">Use the included small Google Apps Script to keep one portfolio accessible on your devices and fetch stock prices. No OAuth client or Google Cloud Console setup is needed for this connection.</p><div class="form-grid section"><label class="field full">Apps Script web app URL<input name="url" id="gatewayURL" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}" type="url"></label><label class="field full">Private sync key<input name="secret" id="syncKey" type="password" autocomplete="off" value="${esc(cfg.secret)}" placeholder="Use the same key on each device"></label></div><div class="actions section"><button type="button" data-action="generate-key">Generate key</button><button type="button" data-action="copy-key">Copy key</button><button type="button" data-action="setup">Step-by-step setup ↗</button></div><div class="notice">Save these settings first, then use Download from cloud or Upload to cloud. Sync is explicit so one device cannot silently overwrite another. The key grants access to your private portfolio; keep it like a password.</div><div class="actions"><button type="button" data-action="test-connection">Test connection</button><button type="button" data-action="cloud-pull">Download from cloud</button><button type="button" data-action="cloud-push">Upload to cloud</button></div><p class="footnote">${cfg.revision===null?'This device has not read the cloud version yet.':'Last known cloud version: '+cfg.revision} · Only holdings, sales, income and prices are synced. Appearance and connection credentials stay on each device.</p>`)}${section('Backups & portability',`<div class="actions"><button type="button" data-action="backup">Download JSON backup</button><button type="button" data-action="csv">Export transactions CSV</button><button type="button" data-action="import">Restore JSON backup</button></div><p class="footnote">Backups do not contain your cloud key. Keep a backup before clearing browser data or switching devices.</p>`)}${section('About your data',`<p class="muted">All amounts display in INR. US holdings preserve the purchase FX rate and use the latest reference FX for value. Manual assets use the price you enter. Blank market fields are unavailable, never zero-filled.</p><p class="footnote">This file runs locally without a server. Market requests require internet. Stocks need the included gateway; mutual fund NAVs use MFAPI, indicative metal spot uses Gold API, and reference FX uses Frankfurter. Provider downtime and delays are possible. <a href="https://www.mfapi.in/docs/" target="_blank" rel="noopener">MFAPI documentation</a> · <a href="https://gold-api.com/docs" target="_blank" rel="noopener">Gold API documentation</a> · <a href="https://frankfurter.dev/" target="_blank" rel="noopener">FX documentation</a>.</p><div class="actions section"><button type="button" data-action="demo">Explore demo</button><button type="button" data-action="print">Print current view</button></div>`,false)}</div><p class="form-error" id="formError" role="alert"></p><div class="form-actions"><button type="button" data-action="close">Close</button><button class="primary">Save settings</button></div></form>`,true);}
function saveSettings(f){const v=Object.fromEntries(new FormData(f));if(v.url&&!validGateway(v.url.trim()))throw Error('Enter the Apps Script deployed /exec URL, not the editor URL.');if(v.secret&&v.secret.length<32)throw Error('Use a sync key of at least 32 characters.');if(v.url.trim()!==cfg.url||v.secret!==cfg.secret)cfg.revision=null;Object.assign(cfg,{theme:v.theme,target:+v.target||1000000,targetDate:v.targetDate||'',url:v.url.trim(),secret:v.secret,usd:+v.usd||0,goldDuty:+v.goldDuty||0,silverDuty:+v.silverDuty||0});if(!demo)writeSettings();render();toast(demo?'Demo settings updated temporarily.':'Settings saved.');}
async function cloudRequest(action,payload={}){if(demo)throw Error('Exit demo before using cloud sync.');if(!validGateway(cfg.url)||cfg.secret.length<32)throw Error('Save a valid Apps Script URL and private sync key first.');const r=await getJSON(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key:cfg.secret,...payload})});if(!r.ok)throw Error(r.message||'Cloud request failed');return r;}
let cloudBusy=false,pendingCloud=null;
async function cloudPull(){if(cloudBusy)return;cloudBusy=true;toast('Reading cloud portfolio…');try{const r=await cloudRequest('read');if(!r.data){cfg.revision=r.revision;writeSettings();toast('Cloud is empty. You can upload this portfolio now.');return;}const data=validateData(r.data);pendingCloud={data,revision:r.revision};openModal('Cloud portfolio ready',`<div class="notice">Cloud version ${r.revision}: ${data.lots.length} purchases, ${data.sales.length} sales, ${data.dividends.length} income entries.</div><p>Downloading replaces the portfolio on this device. Your current portfolio has ${db.lots.length} purchases. Export a backup first if this device contains changes you want to keep.</p><div class="form-actions"><button data-action="backup">Export local backup</button><button data-action="close">Cancel</button><button class="primary" data-action="cloud-accept">Use cloud portfolio</button></div>`);}catch(e){toast(e.message);}finally{cloudBusy=false;}}
async function cloudPush(){if(cloudBusy)return;cloudBusy=true;try{if(cfg.revision===null){const r=await cloudRequest('read');if(r.data){throw Error('A cloud portfolio already exists. Download and review it before uploading from this device. Your local data is unchanged.');}cfg.revision=r.revision;}const r=await cloudRequest('write',{revision:cfg.revision,data:db});cfg.revision=r.revision;writeSettings();toast('Uploaded successfully. Use Download from cloud on your other device.');}catch(e){toast(e.message);}finally{cloudBusy=false;}}
function setupGuide(){openModal('Connect your devices in about 5 minutes',`<p class="muted">You only need your Google account and the script below. Your portfolio is stored in a private JSON file in your Google Drive; the web app checks your secret key before reading or writing it.</p><ol class="instructions"><li>Open <a href="https://script.google.com/home/start" target="_blank" rel="noopener">Google Apps Script</a> and click <strong>New project</strong>. Name it <strong>Folio Sync</strong>.</li><li>Delete the sample code in <code>Code.gs</code>. Click <strong>Copy script</strong> below, paste it into the editor, and save.</li><li>In this app, open <strong>Settings → Generate key → Copy key</strong>. Save settings. Keep a secure copy of the key for your second device.</li><li>In Apps Script, open <strong>Project Settings</strong> (gear icon). Under <strong>Script Properties</strong>, click <strong>Add script property</strong>. Enter <code>SYNC_KEY</code> as the property name and paste your key as its value. Click <strong>Save script properties</strong>.</li><li>In the editor, select the <code>initialize</code> function at the top and click <strong>Run</strong>. Approve access to Google Drive for your own script. If Google labels your personal script unverified, review the script before continuing. This creates <code>Folio-private-data.json</code> in your Drive.</li><li>Click <strong>Deploy → New deployment</strong>. Choose <strong>Web app</strong> from the gear menu. Set <strong>Execute as: Me</strong> and <strong>Who has access: Anyone</strong>. Click <strong>Deploy</strong>. If your organization disallows this option, use a personal Google account or stay in local mode.</li><li>Copy the <strong>Web app URL</strong> ending in <code>/exec</code>. Paste it into this app’s <strong>Settings → Apps Script web app URL</strong>. Save settings, then click <strong>Test connection</strong>.</li><li>On the device containing your portfolio, choose <strong>Upload to cloud</strong>. On your phone or other computer, open this HTML on the same hosted URL, enter the same URL and key in Settings, save, then choose <strong>Download from cloud</strong>.</li><li>Before editing on a different device, download the latest cloud version. After editing, upload. If versions conflict, export your local backup before downloading. The app will refuse a stale upload.</li></ol><div class="notice">Stock price retrieval works once the gateway is deployed. Click Refresh prices. NSE examples: <code>RELIANCE.NS</code>, <code>INFY.NS</code>. BSE example: <code>500325.BO</code>. US example: <code>AAPL</code>. Mutual funds use their MFAPI scheme code. Public Yahoo endpoints can fail or be delayed; manual price entry always remains available.</div><div class="actions"><button class="primary" data-action="copy-script">Copy script</button><button data-action="download-script">Download Code.gs</button><button data-action="settings">Back to settings</button></div><details class="section"><summary>Review the complete server script</summary><div class="inside"><textarea class="code" readonly aria-label="Apps Script source">${esc(SERVER_SCRIPT)}</textarea></div></details><div class="notice">Your sync key is sent only in HTTPS request bodies. Price searches send a symbol or search term, not your quantities or transactions. This connection uses a private key, not Google Sign-In. Do not share the HTML after embedding any credentials; credentials are stored only in the browser’s settings.</div>`,true);}
const SERVER_SCRIPT=String.raw`/* Folio Sync — deploy as a Web app, execute as Me, access Anyone.
   Set Script Property SYNC_KEY to a random 32+ character secret before running initialize().
   Portfolio data is private; all data requests require the secret in a POST body.
   GET permits only fixed public market-data routes. No arbitrary proxy URLs. */
function output_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }
function initialize() {
  var p=PropertiesService.getScriptProperties();
  if((p.getProperty('SYNC_KEY')||'').length<32) throw new Error('Set SYNC_KEY in Project Settings first.');
  var id=p.getProperty('FOLIO_FILE_ID');
  if(!id){var f=DriveApp.createFile('Folio-private-data.json',JSON.stringify({revision:0,data:null}),'application/json');p.setProperty('FOLIO_FILE_ID',f.getId());}
  return 'Ready';
}
function same_(a,b){a=String(a||'');b=String(b||'');var diff=a.length^b.length;for(var i=0;i<Math.max(a.length,b.length);i++)diff|=(a.charCodeAt(i)||0)^(b.charCodeAt(i)||0);return diff===0;}
function doPost(e) {
  var lock=LockService.getScriptLock(),locked=false;
  try {
    if(!e.postData||e.postData.contents.length>12000000)throw new Error('Invalid request size');
    var body=JSON.parse(e.postData.contents),p=PropertiesService.getScriptProperties(),secret=p.getProperty('SYNC_KEY');
    if(!secret||secret.length<32||!same_(body.key,secret))return output_({ok:false,message:'Invalid sync key'});
    if(body.action!=='read'&&body.action!=='write')throw new Error('Unknown action');
    lock.waitLock(15000);locked=true;
    var id=p.getProperty('FOLIO_FILE_ID');if(!id)throw new Error('Run initialize in the Apps Script editor first.');
    var file=DriveApp.getFileById(id),state=JSON.parse(file.getBlob().getDataAsString());
    if(body.action==='read')return output_({ok:true,revision:state.revision,data:state.data});
    if(body.revision!==state.revision)return output_({ok:false,message:'Sync conflict: another device uploaded changes. Your local data is safe. Export a backup, then download the cloud version.'});
    var d=body.data;
    if(!d||d.version!==1||!Array.isArray(d.lots)||!Array.isArray(d.sales)||!Array.isArray(d.dividends)||d.lots.length>2000)throw new Error('Invalid portfolio');
    // Private previous-version file provides recovery from accidental replacements.
    var old=p.getProperty('FOLIO_PREVIOUS_ID');
    if(old)DriveApp.getFileById(old).setContent(JSON.stringify(state));
    else p.setProperty('FOLIO_PREVIOUS_ID',DriveApp.createFile('Folio-previous-version.json',JSON.stringify(state),'application/json').getId());
    var next={revision:state.revision+1,data:d};file.setContent(JSON.stringify(next));
    return output_({ok:true,revision:next.revision});
  } catch(err){return output_({ok:false,message:String(err.message||err)});} finally {if(locked)lock.releaseLock();}
}
function doGet(e) {
  try {
    var p=e.parameter||{},action=p.action;
    if(action==='ping')return output_({ok:true,app:'folio-fresh',version:1});
    var path;
    if(action==='chart'){
      var symbol=String(p.symbol||'');if(!/^[A-Za-z0-9.^=_-]{1,40}$/.test(symbol))throw new Error('Invalid symbol');
      var range=['5d','1mo','1y','max'].indexOf(p.range)>=0?p.range:'1y';
      path='/v8/finance/chart/'+encodeURIComponent(symbol)+'?interval=1d&range='+range;
    }else if(action==='search'){
      var q=String(p.q||'').slice(0,100);if(!q)throw new Error('Search term required');
      path='/v1/finance/search?q='+encodeURIComponent(q)+'&quotesCount=15&newsCount=5';
    }else throw new Error('Unknown public route');
    var hash=Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,path)),cache=CacheService.getScriptCache(),hit=cache.get(hash);
    if(hit)return ContentService.createTextOutput(hit).setMimeType(ContentService.MimeType.JSON);
    var hosts=['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com'];
    for(var i=0;i<hosts.length;i++){
      var r=UrlFetchApp.fetch(hosts[i]+path,{muteHttpExceptions:true,headers:{'User-Agent':'Mozilla/5.0'}});
      if(r.getResponseCode()===200){var text=r.getContentText();JSON.parse(text);if(text.length<90000)cache.put(hash,text,300);return ContentService.createTextOutput(text).setMimeType(ContentService.MimeType.JSON);}
    }
    throw new Error('Market provider unavailable. Retain the previous price or enter a manual quote.');
  }catch(err){return output_({error:String(err.message||err)});}
}`;
function demoData(){const n=blank(),end=dateMs(nowDate()),seed=[['NSE','INFY.NS','Infosys',45,1420,1612,350],['NSE','HDFCBANK.NS','HDFC Bank',80,1580,1710,280],['US','AAPL','Apple',8,174,211,330],['Mutual Fund','120503','Axis Bluechip • illustrative',650,43,49.6,400],['Gold','Gold','Gold • 24K spot',12,6050,6810,310],['Silver','Silver','Silver • spot',400,91,85,210]];for(let j=0;j<seed.length;j++){const[type,symbol,name,units,buyPrice,current,age]=seed[j],id='demo-'+j,buyDate=iso(end-age*dayMs),h={id,type,symbol,name,units,buyPrice,buyFx:type==='US'?83:1,buyDate,fees:25,notes:'Illustrative demo position, not a recommendation or current market quote.'};n.lots.push(h);const points=[];for(let i=0;i<=age;i++){const ratio=i/age,p=buyPrice+(current-buyPrice)*ratio+Math.sin(i*.065+j)*buyPrice*.035*Math.sin(Math.PI*ratio);points.push({date:iso(dateMs(buyDate)+i*dayMs),price:p});}n.history[key(h)]=points;n.quotes[key(h)]={price:current,previous:current*(j===3?1.003:.994),date:nowDate(),source:'Demo • illustrative',updatedAt:new Date().toISOString(),meta:{}};}n.sales.push({id:'demo-sale',lotId:'demo-0',units:10,price:1650,fx:1,fees:20,date:iso(end-50*dayMs),notes:'Illustrative partial sale'});n.dividends.push({id:'demo-income',lotId:'demo-0',amount:900,date:iso(end-60*dayMs),notes:'Illustrative dividend'});for(let i=450;i>=0;i--)n.fxHistory.push({date:iso(end-i*dayMs),price:83+(450-i)/450*2});return n;}
let preDemoCfg=null;
function enterDemo(){if(busy)throw Error('Wait for the price update to finish before opening demo.');if(!demo){preDemoCfg={...cfg};demo=true;cfg.usd=85;db=demoData();}closeModal();page='home';render();}
function exitDemo(){demo=false;if(preDemoCfg)cfg=preDemoCfg;preDemoCfg=null;db=read(STORE,blank());try{storageSnapshot=localStorage.getItem(STORE);}catch{}closeModal();render();}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard.');}catch{openModal('Copy this text',`<p class="muted">Select and copy the text below.</p><textarea class="code" readonly>${esc(t)}</textarea>`);}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;try{switch(action){case'nav':page=id;render();window.scrollTo({top:0,behavior:'instant'});break;case'add':addSheet();break;case'edit':addSheet(id);break;case'close':closeModal();break;case'theme':cfg.theme=cfg.theme==='dark'?'light':'dark';if(!demo)writeSettings();render();break;case'settings':settingsSheet();break;case'range':range=id;render();break;case'filter':filter=id;render();break;case'performance':performance();break;case'performance-range':performance(id);break;case'detail':detailSheet(id);break;case'detail-range':detailSheet(detailId,id);break;case'sell':sellSheet(id);break;case'sell-mode':{const f=$('sellForm');f.elements.namedItem('units').value=id==='all'?remaining(db.lots.find(h=>h.id===f.dataset.id)):'';f.elements.namedItem('units').focus();f.querySelectorAll('[data-action="sell-mode"]').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));sellPreview();break;}case'price':priceSheet(id);break;case'income':incomeSheet(id);break;case'delete':confirmDialog('Delete purchase lot?','This removes the purchase and all its related sales and income. Export a backup first if you may need these records.','delete-confirm',id);break;case'delete-confirm':mutate(n=>{n.lots=n.lots.filter(h=>h.id!==id);n.sales=n.sales.filter(s=>s.lotId!==id);n.dividends=n.dividends.filter(d=>d.lotId!==id);});closeModal();toast('Purchase lot and related records removed.');break;case'undo-sale':confirmDialog('Undo this sale?','The sold units will return to the holding and its realized gain will be removed.','undo-sale-confirm',id);break;case'undo-sale-confirm':mutate(n=>n.sales=n.sales.filter(s=>s.id!==id));closeModal();break;case'delete-income':confirmDialog('Remove income?','This removes the recorded income from returns calculations.','delete-income-confirm',id);break;case'delete-income-confirm':mutate(n=>n.dividends=n.dividends.filter(d=>d.id!==id));closeModal();break;case'rate':rate=+id;render();break;case'refresh':await refreshPrices();break;case'refresh-detail':await refreshPrices(id);break;case'select-search':await selectSearch(id);break;case'benchmark':await benchmark(id);break;case'news':await news(id);break;case'backup':exportBackup();break;case'csv':csvExport();break;case'history-csv':csvExport(true);break;case'import':importSheet();break;case'restore':if(pendingImport){commit(pendingImport);pendingImport=null;closeModal();toast('Backup restored on this device.');}break;case'demo':enterDemo();break;case'exit-demo':exitDemo();break;case'generate-key':{const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);$('syncKey').value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');toast('Key generated. Copy it and save settings.');break;}case'copy-key':await copyText($('syncKey').value);break;case'setup':setupGuide();break;case'copy-script':await copyText(SERVER_SCRIPT);break;case'download-script':download('Code.gs',SERVER_SCRIPT,'text/plain');break;case'test-connection':{const r=await gateway('ping');toast(r.app==='folio-fresh'?'Gateway connected. Stock retrieval is available; test sync with Download from cloud.':'Unexpected response: deploy the included script.');break;}case'cloud-pull':await cloudPull();break;case'cloud-push':await cloudPush();break;case'cloud-accept':if(pendingCloud){commit(pendingCloud.data);cfg.revision=pendingCloud.revision;writeSettings();pendingCloud=null;closeModal();toast('Cloud portfolio saved on this device.');}break;case'print':closeModal();window.print();break;}}catch(err){formError(err);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;try{if(f.id==='investmentForm')saveInvestment(f);else if(f.id==='sellForm')saveSale(f);else if(f.id==='settingsForm')saveSettings(f);else if(f.id==='priceForm'){const h=db.lots.find(h=>h.id===f.dataset.id),v=Object.fromEntries(new FormData(f));if(!(+v.price>0)||!validDate(v.date)||v.previous&&!(+v.previous>0))throw Error('Enter a valid price and date.');mutate(n=>{n.quotes[key(h)]={price:+v.price,previous:v.previous?+v.previous:null,date:v.date,source:'Manual',updatedAt:new Date().toISOString()};n.history[key(h)]=[...(n.history[key(h)]||[]).filter(p=>p.date!==v.date),{date:v.date,price:+v.price}].sort((a,b)=>a.date.localeCompare(b.date));});closeModal();toast('Manual price saved.');}else if(f.id==='incomeForm'){const v=Object.fromEntries(new FormData(f)),h=db.lots.find(h=>h.id===f.dataset.id);if(!(+v.amount>0)||!validDate(v.date)||v.date<h.buyDate)throw Error('Enter a positive amount and a payment date on or after purchase.');mutate(n=>n.dividends.push({id:uid(),lotId:f.dataset.id,amount:+v.amount,date:v.date,notes:v.notes}));closeModal();toast('Income recorded.');}}catch(err){formError(err);}});
document.addEventListener('input',e=>{if(e.target.id==='perfZoom'){perfZoom=+e.target.value;updatePerfChart();}if(e.target.id==='perfPan'){perfPan=+e.target.value;updatePerfChart();}if(e.target.id==='holdingSearch'){const position=e.target.selectionStart;query=e.target.value;render();$('holdingSearch').focus();$('holdingSearch').setSelectionRange(position,position);}if(e.target.id==='assetLookup'){clearTimeout(searchTimer);searchTimer=setTimeout(lookup,400);}if(e.target.closest('#sellForm'))sellPreview();if(e.target.id==='rateSlider'){rate=+e.target.value;$('rateLabel').textContent=rate+'%';const t=totals();$('scenarioTable').innerHTML=scenarioTable(forecastBase==='current'?t.value:t.invested);}});
document.addEventListener('change',e=>{if(e.target.id==='assetType')assetTypeChange();if(e.target.id==='forecastBase'){forecastBase=e.target.value;render();}if(e.target.id==='importFile')previewImport(e.target.files[0]);});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
window.addEventListener('storage',e=>{if(e.key===STORE&&!demo){toast('Portfolio changed in another tab. Reload to load those changes before editing.');transientError='Another tab changed this portfolio. Reload this page before making further edits.';render();}});
try{db=validateData(db);}catch(e){transientError='Saved data could not be loaded. Import a valid backup; the stored copy has not been overwritten.';db=blank();}
