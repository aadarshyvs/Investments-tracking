<script>
'use strict';
/* Folio — fresh implementation. All calculations and UI work without third-party JS. */
const VERSION=1, STORE='folio.fresh.v1', SETTINGS='folio.fresh.settings.v1';
const TYPES=['NSE','BSE','US','Mutual Fund','Gold','Silver','Other'];
const COLORS=['#91eed4','#91baff','#e9c881','#c4a1ee','#ff9b9f','#73cbd8','#96a8ba'];

const dateFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'});
let clockMinute=-1,clockDay='';
const nowDate=()=>{const minute=Math.floor(Date.now()/60000);if(minute!==clockMinute){clockMinute=minute;clockDay=dateFormatter.format(new Date());}return clockDay;};
const dayMs=86400000, dateMs=d=>Date.parse(d+'T00:00:00Z'), days=(a,b=nowDate())=>Math.max(0,Math.round((dateMs(b)-dateMs(a))/dayMs));
const iso=t=>new Date(t).toISOString().slice(0,10), uid=()=>globalThis.crypto?.randomUUID?.()||'f'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const sum=a=>a.reduce((x,y)=>x+y,0), finite=x=>Number.isFinite(Number(x)), money=(v,c='INR')=>Number.isFinite(v)?new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:2,minimumFractionDigits:0}).format(v):'—';
const pct=v=>Number.isFinite(v)?(v>0?'+':'')+v.toFixed(2)+'%':'—', qty=v=>Number(v).toLocaleString('en-IN',{maximumFractionDigits:6});
const sign=v=>v>=0?'up':'down', shortDate=d=>new Date(dateMs(d)).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const label=t=>({US:'US stocks','Mutual Fund':'Mutual funds',NSE:'NSE stocks',BSE:'BSE stocks'}[t]||t), key=h=>h.type+':'+h.symbol;
function blank(){return {version:VERSION,lots:[],sales:[],dividends:[],quotes:{},history:{},fxHistory:[],updatedAt:null};}
let cfg={theme:'dark',url:'',secret:'',revision:null,usd:0,usdDate:'',goldDuty:0,silverDuty:0,target:1000000,targetDate:'',...read(SETTINGS,{})};
let storageSnapshot;try{storageSnapshot=localStorage.getItem(STORE);}catch{storageSnapshot=null;}
let db=read(STORE,blank()), demo=false, page='home', range='Max', filter='All', query='', rate=12, forecastBase='current', busy=false, searchTimer, lastFocus, transientError='';
function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f;}catch{return f;}}
function toast(t){$('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',6500);}
function writeSettings(){try{localStorage.setItem(SETTINGS,JSON.stringify(cfg));}catch{toast('Settings could not be saved. Browser storage is unavailable.');}}
function commit(next){next.updatedAt=new Date().toISOString();if(!demo){try{if(localStorage.getItem(STORE)!==storageSnapshot)throw Error('STALE');const serialized=JSON.stringify(next);localStorage.setItem(STORE,serialized);storageSnapshot=serialized;}catch(e){throw Error(e.message==='STALE'?'Another tab changed the portfolio. Export a backup and reload before editing.':'Save failed: device storage is full or unavailable. Export a backup before leaving.');}}db=next;render();}
function mutate(fn){const n=structuredClone(db);fn(n);commit(n);}
function remaining(h,data=db){return Math.max(0,h.units-sum(data.sales.filter(s=>s.lotId===h.id).map(s=>s.units)));}
function unitBasis(h){return h.buyPrice*h.buyFx+(h.fees||0)/h.units;}
function quote(h){return db.quotes[key(h)]||null;}
function holding(h){const units=remaining(h),q=quote(h),fx=h.type==='US'?(cfg.usd||h.buyFx):1,price=q?.price??h.buyPrice,estimated=!q||(h.type==='US'&&!cfg.usd),cost=units*unitBasis(h),value=units*price*fx;return {...h,units,cost,value,price,fx,q,estimated,pnl:value-cost,returnPct:cost?(value/cost-1)*100:0,change:q?.previous>0?(price-q.previous)*units*fx:null,changePct:q?.previous>0?(price/q.previous-1)*100:null};}
function exposures(){const groups=new Map();for(const h of active()){const k=key(h),g=groups.get(k)||{name:h.name,type:h.type,symbol:h.symbol,cost:0,value:0};g.cost+=h.cost;g.value+=h.value;groups.set(k,g);}return [...groups.values()];}
function active(){return db.lots.filter(h=>remaining(h)>1e-8).map(holding);}
function salePnl(s){const h=db.lots.find(h=>h.id===s.lotId);return h?s.units*s.price*s.fx-(s.fees||0)-s.units*unitBasis(h):0;}
function totals(){const hs=active(),invested=sum(hs.map(h=>h.cost)),value=sum(hs.map(h=>h.value)),realized=sum(db.sales.map(salePnl)),income=sum(db.dividends.map(d=>d.amount));return {hs,invested,value,pnl:value-invested,realized,income,total:value-invested+realized+income,day:hs.every(h=>h.change!==null)?sum(hs.map(h=>h.change)):null,estimated:hs.some(h=>h.estimated),wins:hs.filter(h=>h.pnl>=0).length};}
function xirr(flows){if(flows.length<2||!flows.some(f=>f.amount<0)||!flows.some(f=>f.amount>0))return null;const start=Math.min(...flows.map(f=>dateMs(f.date)));if(Math.max(...flows.map(f=>dateMs(f.date)))===start)return null;const f=r=>sum(flows.map(v=>v.amount/Math.pow(1+r,(dateMs(v.date)-start)/dayMs/365.25)));let lo=-.9999,hi=1,a=f(lo),b=f(hi);while(a*b>0&&hi<1e8){hi=hi*2+1;b=f(hi);}if(!Number.isFinite(a)||a*b>0)return null;for(let i=0;i<180;i++){const m=(lo+hi)/2,v=f(m);if(Math.abs(v)<1e-7)return m;if(v*a>0){lo=m;a=v;}else hi=m;}return (lo+hi)/2;}
function lotXirr(h){const orig=db.lots.find(l=>l.id===h.id)||h;return xirr([{date:orig.buyDate,amount:-(orig.units*orig.buyPrice*orig.buyFx+(orig.fees||0))},...db.sales.filter(s=>s.lotId===h.id).map(s=>({date:s.date,amount:s.units*s.price*s.fx-(s.fees||0)})),...db.dividends.filter(d=>d.lotId===h.id).map(d=>({date:d.date,amount:d.amount})),{date:nowDate(),amount:h.value}]);}
function portfolioXirr(){const t=totals();return xirr([...db.lots.map(h=>({date:h.buyDate,amount:-(h.units*h.buyPrice*h.buyFx+(h.fees||0))})),...db.sales.map(s=>({date:s.date,amount:s.units*s.price*s.fx-(s.fees||0)})),...db.dividends.map(d=>({date:d.date,amount:d.amount})),{date:nowDate(),amount:t.value}]);}
function hhi(hs=active()){const weights={};hs.forEach(h=>weights[key(h)]=(weights[key(h)]||0)+h.cost);const total=sum(Object.values(weights));return total?sum(Object.values(weights).map(v=>Math.pow(v/total,2)))*100:0;}
function latestAt(list,date){let lo=0,hi=list.length-1,out=null;while(lo<=hi){let m=(lo+hi)>>1;if(list[m].date<=date){out=list[m];lo=m+1;}else hi=m-1;}return out;}
function historyRows(){if(!db.lots.length)return[];const start=db.lots.reduce((a,h)=>a<h.buyDate?a:h.buyDate,nowDate());const rows=[];let prev=null;for(let time=dateMs(start);time<=dateMs(nowDate());time+=dayMs){const date=iso(time);let value=0,invested=0,valid=true,buy=0,sold=0,income=0;for(const h of db.lots){if(h.buyDate>date)continue;const n=h.units-sum(db.sales.filter(s=>s.lotId===h.id&&s.date<=date).map(s=>s.units));if(h.buyDate===date)buy+=h.units*h.buyPrice*h.buyFx+(h.fees||0);if(n<1e-8)continue;let p=latestAt(db.history[key(h)]||[],date),fx=h.type==='US'?latestAt(db.fxHistory||[],date)?.price:1;if(date===nowDate()){const q=quote(h);if(q)p={price:q.price};if(h.type==='US'&&cfg.usd)fx=cfg.usd;}if(!p||!fx){valid=false;continue;}value+=n*p.price*fx;invested+=n*unitBasis(h);}sold=sum(db.sales.filter(s=>s.date===date).map(s=>s.units*s.price*s.fx-(s.fees||0)));income=sum(db.dividends.filter(d=>d.date===date).map(d=>d.amount));const change=valid&&prev?.valid?value-prev.value-buy+sold+income:null;const r=change!==null&&prev.value>0?change/prev.value:null;const row={date,value:valid?value:null,invested,valid,buy,sold,income,change,return:r,open:prev?.valid?prev.value:null};rows.push(row);prev=row;}return rows;}
function periodReturn(rows,span){const from=span==='Max'?rows[0]?.date:iso(dateMs(nowDate())-span*dayMs);const part=rows.filter(r=>span==='Max'||r.date>from);if(!part.length||part.some(r=>!r.valid)||part.slice(1).some(r=>r.return===null&&r.open>0))return null;return (part.reduce((a,r)=>a*(1+(r.return||0)),1)-1)*100;}
function inRange(rows,r){const spans={'7D':7,'1W':7,'1M':30,'3M':90,'6M':180,'1Y':365,'2Y':730,'5Y':1826};return !spans[r]?rows:rows.filter(d=>d.date>=iso(dateMs(nowDate())-spans[r]*dayMs));}
function svgLine(rows,series=[{field:'value',color:'var(--accent)',label:'Portfolio value'},{field:'invested',color:'var(--gold)',dash:true,label:'Cost basis'}],height=235){const valid=rows.filter(r=>series.some(s=>Number.isFinite(r[s.field])));if(valid.length<2)return '<div class="chart-empty"><strong>History is not available yet</strong><small>Refresh prices to fetch history. Missing data is never replaced with an invented curve.</small></div>';const w=820,pad={l:76,r:16,t:20,b:30},values=rows.flatMap(r=>series.map(s=>r[s.field]).filter(Number.isFinite)),min=Math.min(...values)*.95,max=Math.max(...values)*1.05||1,span=max-min||1,x=i=>pad.l+i/(rows.length-1)*(w-pad.l-pad.r),y=v=>pad.t+(max-v)/span*(height-pad.t-pad.b);let out=`<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="${esc(series.map(s=>s.label).join(' and '))} over time">`;for(let i=0;i<4;i++){const v=min+span*i/3,yy=y(v);out+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad.l-10}" y="${yy+4}" text-anchor="end">${v>=100000?(v/100000).toFixed(1)+'L':v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`;}for(const s of series){let path='',open=false;rows.forEach((r,i)=>{if(!Number.isFinite(r[s.field])){open=false;return;}path+=(open?'L':'M')+x(i).toFixed(2)+','+y(r[s.field]).toFixed(2)+' ';open=true;});out+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.7" ${s.dash?'stroke-dasharray="6 6"':''} stroke-linejoin="round"/>`;const i=rows.length-1;if(Number.isFinite(rows[i][s.field]))out+=`<circle cx="${x(i)}" cy="${y(rows[i][s.field])}" r="4" fill="${s.color}"/>`;}out+=`<text x="${pad.l}" y="${height-5}">${esc(shortDate(rows[0].date))}</text><text x="${w-pad.r}" y="${height-5}" text-anchor="end">${esc(shortDate(rows.at(-1).date))}</text></svg>`;return out;}
function bars(items,format=money){const max=Math.max(...items.map(i=>Math.abs(i.value)),1);return items.length?items.map((i,index)=>`<div class="bar-row"><span class="asset-name">${esc(i.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.abs(i.value)/max*100}%;background:${i.color||(i.value<0?'var(--down)':COLORS[index%COLORS.length])}"></div></div><span class="right num ${i.value<0?'down':''}">${format(i.value)}</span></div>`).join(''):'<p class="muted">No data yet.</p>';}
function donut(items){const total=sum(items.map(i=>Math.max(0,i.value)));if(!total)return '<p class="muted">Add investments to see your allocation.</p>';let acc=0;const colors=items.map((i,n)=>{const start=acc;acc+=i.value/total*100;return `${COLORS[n%7]} ${start}% ${acc}%`;}).join(',');return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${colors})" role="img" aria-label="Allocation by invested amount"></div><div style="flex:1;min-width:9rem">${items.map((i,n)=>`<div class="row"><span><i style="display:inline-block;width:.5rem;height:.5rem;background:${COLORS[n%7]};border-radius:50%;margin-right:.5rem"></i>${esc(i.name)}</span><strong class="num">${(i.value/total*100).toFixed(1)}%</strong></div>`).join('')}</div></div>`;}
function metric(title,value,sub='',cls=''){return `<div class="card metric"><div class="eyebrow">${title}</div><div class="value num ${cls}">${value}</div><small>${sub}</small></div>`;}
function heading(title,subtitle,actions=''){return `<div class="page-head"><div><div class="eyebrow" style="margin-bottom:.5rem">YOUR PERSONAL PORTFOLIO</div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`;}
function ranges(action,current,opts=['1W','1M','3M','6M','1Y','Max']){return `<div class="pills">${opts.map(r=>`<button data-action="${action}" data-id="${r}" class="${r===current?'selected':''}">${r}</button>`).join('')}</div>`;}
function empty(){return `<div class="card empty"><div class="illustration">↗</div><h2>A clearer view starts here.</h2><p>Add your first investment to track its performance. Your data stays on this device until you choose to connect cloud sync.</p><div class="actions"><button class="primary" data-action="add">+ Add investment</button><button data-action="demo">Explore demo</button><button class="ghost" data-action="import">Import backup</button></div></div>`;}
function render(){const t=totals();document.documentElement.dataset.theme=cfg.theme;document.querySelector('meta[name="theme-color"]').content=cfg.theme==='light'?'#edf2f5':'#0c1622';const nav=PAGES.map(([id,icon,title])=>`<button data-action="nav" data-id="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icon}</span><span>${title}</span></button>`).join('');$('desktopNav').innerHTML=nav;$('mobileNav').innerHTML=nav;$('demoBanner').innerHTML=demo?'<div class="demo-banner"><span>DEMO • Illustrative holdings and prices. Your portfolio is untouched.</span><button data-action="exit-demo">Exit demo</button></div>':'';$('statusLabel').textContent=demo?'Exploring demo':cfg.url?'Cloud configured • sync in Settings':'Private on this device';$('sideStatus').textContent=db.updatedAt?'Saved '+new Date(db.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Stored on this device';$('content').innerHTML=({home:homeView,holdings:holdingsView,analytics:analyticsView,predictions:predictionsView,realized:realizedView}[page])();if(transientError)$('content').insertAdjacentHTML('afterbegin',`<div class="notice warn">${esc(transientError)}</div>`);}
function homeView(){const t=totals(),rows=historyRows(),best=[...t.hs].sort((a,b)=>b.returnPct-a.returnPct)[0],move=[...t.hs].sort((a,b)=>Math.abs(b.changePct||0)-Math.abs(a.changePct||0))[0],last=[...db.lots].sort((a,b)=>b.buyDate.localeCompare(a.buyDate))[0],allocation=TYPES.map(type=>({name:label(type),value:sum(t.hs.filter(h=>h.type===type).map(h=>h.cost))})).filter(i=>i.value);return heading('Make every investment count.','Your wealth, brought together.',`<button data-action="performance">View performance ↗</button>`)+(!db.lots.length?empty():`<div class="dashboard"><section class="card hero"><div class="card-head"><button class="hero-title" data-action="performance"><span class="eyebrow">PORTFOLIO VALUE ↗</span></button><span class="pill">${demo?'ILLUSTRATIVE':t.estimated?'INCLUDES ESTIMATES':'LATEST AVAILABLE'}</span></div><div class="big num">${money(t.value)}</div><p class="${sign(t.pnl)} num">${money(t.pnl)} <span class="pill">${pct(t.invested?t.pnl/t.invested*100:0)}</span> <small>unrealized return</small></p><div class="card-head section"><div class="legend"><span><i style="background:var(--accent)"></i>Market value</span><span><i style="background:var(--gold)"></i>Open cost basis</span></div>${ranges('range',range)}</div><button class="chart-wrap hero-title" data-action="performance" aria-label="Open full portfolio performance" style="width:100%;display:block">${svgLine(inRange(rows,range))}</button><div class="strip"><div><small>Invested</small><strong class="num">${money(t.invested)}</strong></div><div><small>Today’s price move</small><strong class="num ${sign(t.day||0)}">${money(t.day)}</strong></div><div><small>Realized gains</small><strong class="num ${sign(t.realized)}">${money(t.realized)}</strong></div><div><small>Winners / losers</small><strong>${t.wins} / ${t.hs.length-t.wins}</strong></div></div><p class="footnote">${t.estimated?'Unpriced holdings use purchase price as an estimate. ':''}Prices can be delayed. A missing previous close makes to (h.changePct)}</span><span class="muted" style="float:right">↗</span></button>`).join('')}</div></section>`);}
function holdingsView(){const hs=active().filter(h=>(filter==='All'||h.type===filter)&&(!query||(h.name+' '+h.symbol).toLowerCase().includes(query.toLowerCase())));return heading('Your investments.','Every position. One place.',`<button data-action="csv">Export CSV ↓</button><button class="primary" data-action="add">+ Add investment</button>`)+`<div class="toolbar"><div class="pills">${['All',...TYPES].map(f=>`<button data-action="filter" data-id="${f}" class="${f===filter?'selected':''}">${esc(f)}</button>`).join('')}</div><input class="search" id="holdingSearch" placeholder="Search your holdings…" aria-label="Search holdings" value="${esc(query)}"></div>`+(!db.lots.length?empty():hs.length?`<div class="holding-grid">${hs.map(h=>`<article class="card"><div class="card-head"><div class="asset"><div class="avatar">${esc(h.symbol.slice(0,2))}</div><div class="asset-name"><strong>${esc(h.name)}</strong><small>${esc(h.symbol)}</small></div></div><span class="pill">${esc(h.type)}</span></div><div style="display:flex;justify-content:space-between;gap:1rem"><div><small>Market value</small><h2 class="num">${money(h.value)}</h2></div><div class="right ${sign(h.pnl)}"><strong class="num">${money(h.pnl)}</strong><small class="${sign(h.pnl)}">${pct(h.returnPct)}</small></div></div><div class="mini"><div><small>Units</small><strong class="num">${qty(h.units)}</strong></div><div><small>Buy price</small><strong class="num">${money(h.buyPrice,h.type==='US'?'USD':'INR')}</strong></div><div><small>Day change</small><strong class="num ${sign(h.changePct||0)}">${pct(h.changePct)}</strong></div></div><p class="footnote">${h.estimated?'Purchase-price estimate':esc(h.q.source)+' · '+esc(h.q.date)}${h.type==='US'?' · USD/INR '+qty(h.fx):''}</p><div class="actions"><button data-action="detail" data-id="${h.id}">Details ↗</button><button data-action="edit" data-id="${h.id}">Edit</button><button data-action="sell" data-id="${h.id}">Sell</button><button data-action="price" data-id="${h.id}">Price</button><button class="danger" data-action="delete" data-id="${h.id}" aria-label="Delete ${esc(h.name)}">×</button></div></article>`).join('')}</div>`:'<div class="card empty"><h2>No matching open positions</h2><p>Try another filter, or add a new investment.</p></div>');}
function section(title,body,open=true){return `<details ${open?'open':''}><summary>${title}</summary><div class="inside">${body}</div></details>`;}
function monthlyInvest(){const groups={};db.lots.forEach(h=>groups[h.buyDate.slice(0,7)]=(groups[h.buyDate.slice(0,7)]||0)+h.units*unitBasis(h));return Object.entries(groups).sort().map(([name,value])=>({name,value}));}
function monthlyReturns(){const groups={};for(const r of historyRows()){const k=r.date.slice(0,7);if(!groups[k])groups[k]={name:k,factor:1,valid:true};if(!r.valid)groups[k].valid=false;if(r.return!==null)groups[k].factor*=1+r.return;}return Object.values(groups).filter(i=>i.valid).map(i=>({name:i.name,value:(i.factor-1)*100}));}
function booking(){const realized={};db.sales.forEach(s=>{const m=s.date.slice(0,7);realized[m]=(realized[m]||0)+salePnl(s);});const monthEnd={};for(const r of historyRows())if(r.valid)monthEnd[r.date.slice(0,7)]=r;const months=[...new Set([...Object.keys(realized),...Object.keys(monthEnd)])].sort();const values=months.map(m=>({date:m+'-01',realized:realized[m]||0,unrealized:monthEnd[m]?monthEnd[m].value-monthEnd[m].invested:null}));const data=values.filter(r=>r.unrealized!==null).map((r,i)=>({x:i,y:r.unrealized+r.realized}));let forecast='';if(data.length>=3){const n=data.length,mx=sum(data.map(d=>d.x))/n,my=sum(data.map(d=>d.y))/n,den=sum(data.map(d=>(d.x-mx)**2)),slope=den?sum(data.map(d=>(d.x-mx)*(d.y-my)))/den:0,intercept=my-slope*mx,sd=Math.sqrt(sum(data.map(d=>(d.y-(intercept+slope*d.x))**2))/Math.max(1,n-2));forecast='<div class="growth-chips section">'+[0,1,2].map(i=>`<div class="growth-chip"><small>★ Month +${i+1}</small><strong class="num">${money(intercept+slope*(n+i))}</strong><small>Range ${money(intercept+slope*(n+i)-2*sd)} to ${money(intercept+slope*(n+i)+2*sd)}</small></div>`).join('')+'</div><p class="footnote">Exploratory linear trend of realized-in-month + end-month unrealized. Bands are ±2 residual standard deviations, not confidence guarantees or expected investment returns.</p>';}
return svgLine(values,[{field:'realized',color:'var(--blue)',label:'Realized in month'},{field:'unrealized',color:'var(--accent)',label:'Unrealized at month end'}])+`<div class="legend"><span><i style="background:var(--blue)"></i>Realized in month</span><span><i style="background:var(--accent)"></i>Unrealized at month end</span></div>`+forecast;}
function analyticsView(){const t=totals(),hh=hhi(),cat=TYPES.map(type=>({name:label(type),value:sum(t.hs.filter(h=>h.type===type).map(h=>h.pnl))})),dist=[{name:'Below −20%',test:v=>v< -20},{name:'−20% to 0%',test:v=>v>=-20&&v<0},{name:'0% to 20%',test:v=>v>=0&&v<20},{name:'20% to 50%',test:v=>v>=20&&v<=50},{name:'Above 50%',test:v=>v>50}].map(b=>({name:b.name,value:t.hs.filter(h=>b.test(h.returnPct)).length})),months=monthlyReturns().sort((a,b)=>b.value-a.value);return heading('The bigger picture.','Understand what is driving your portfolio.')+(!db.lots.length?empty():`<div class="stack">${section('01 / Portfolio growth',svgLine(historyRows())+`<div class="legend"><span><i style="background:var(--accent)"></i>Market value</span><span><i style="background:var(--gold)"></i>Open cost basis</span></div><h3 class="section">Invested vs current value</h3>`+bars(t.hs.flatMap(h=>[{name:h.name+' • invested',value:h.cost,color:'var(--gold)'},{name:h.name+' • current',value:h.value,color:'var(--accent)'}])))}${section('02 / Returns analysis',`<div class="grid two"><div><h3>Annualized return (XIRR)</h3>${bars(t.hs.map(h=>({name:h.name,value:(lotXirr(h)??NaN)*100})).filter(i=>Number.isFinite(i.value)),pct)}<p class="footnote">Returns under one year are annualized and can be extreme. Unsolvable cash flows show no XIRR.</p></div><div><h3>Profit & loss by asset type</h3>${bars(cat.filter(i=>i.value))}<h3 class="section">Return distribution</h3>${bars(dist,qty)}</div></div>`)}${section('03 / Investment behaviour',`<div class="grid two"><div><h3>Monthly contributions</h3>${bars(monthlyInvest())}</div><div><h3>Holding period</h3>${bars([...t.hs].sort((a,b)=>a.buyDate.localeCompare(b.buyDate)).map(h=>({name:h.name,value:days(h.buyDate)})),v=>qty(v)+' d')}</div></div><h3 class="section">Best and worst observed months</h3><div class="growth-chips section">${[...months.slice(0,3),...months.slice(-3).filter(i=>!months.slice(0,3).includes(i))].map(m=>`<div class="growth-chip"><small>${m.name}</small><strong class="${sign(m.value)} num">${pct(m.value)}</strong></div>`).join('')||'<p class="muted">Requires complete price and FX history.</p>'}</div><p class="footnote">Geometrically linked daily returns adjust for recorded purchases, sale proceeds and income. Intraday cash-flow timing is approximated as end of day.</p>`)}${section('04 / Risk & portfolio health',`<div class="grid two"><div><h3>Concentration · HHI ${hh.toFixed(1)} / 100</h3><div class="bar-track section"><div class="bar-fill" style="width:${hh}%;background:${hh>40?'var(--down)':'var(--gold)'}"></div></div><p class="footnote">Sum of squared invested weights, combining lots of the same asset. Lower means more evenly spread; 100 means one asset. This is not a complete measure of risk.</p><h3 class="section">Heuristic exposure score</h3>${bars(t.hs.map(h=>({name:h.name,value:Math.min(100,(t.invested?h.cost/t.invested:0)*100*({NSE:1.8,BSE:1.8,US:2,'Mutual Fund':1.2,Gold:1,Silver:1.6,Other:2}[h.type])*(days(h.buyDate)<90?1.2:1)),color:'var(--gold)'})),v=>v.toFixed(0)+'/100')}<p class="footnote">Type, concentration and short holding age only; not measured volatility or an investment recommendation.</p></div><div><h3>Allocation by invested amount</h3><div class="spacer"></div>${donut(TYPES.map(type=>({name:type,value:sum(t.hs.filter(h=>h.type===type).map(h=>h.cost))})).filter(i=>i.value))}<h3 class="section">Portfolio health profile</h3>${radar(t)}</div></div>`)}${section('05 / Profit booking & exploratory trend',booking(),false)}</div>`);}
function radar(t){const raw=[Math.max(0,Math.min(100,t.invested?t.pnl/t.invested*100+50:0)),100-hhi(),Math.min(100,sum(t.hs.map(h=>days(h.buyDate)))/Math.max(1,t.hs.length)/365*100),t.hs.length?t.wins/t.hs.length*100:0,Math.min(100,t.value/(cfg.target||1)*100)],names=['Return','Diversity','Tenure','Win rate','Goal'];const p=(i,v)=>[170+Math.sin(i*Math.PI*2/5)*v,130-Math.cos(i*Math.PI*2/5)*v];return `<svg class="chart" viewBox="0 0 340 275" role="img" aria-label="Heuristic portfolio health radar">${[.25,.5,.75,1].map(s=>`<polygon points="${raw.map((_,i)=>p(i,90*s).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}<polygon points="${raw.map((v,i)=>p(i,v*.9).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)"/>${names.map((n,i)=>{const[x,y]=p(i,115);return `<text x="${x}" y="${y}" text-anchor="middle">${n}</text>`;}).join('')}</svg><p class="footnote">Normalized descriptive scores; “Goal” measures progress toward your target.</p>`;}
function predictionsView(){const t=totals(),base=forecastBase==='current'?t.value:t.invested,annual=portfolioXirr(),leader=[...t.hs].map(h=>({...h,xirr:lotXirr(h)})).sort((a,b)=>(b.xirr??-Infinity)-(a.xirr??-Infinity)),advice=[];const stocks=sum(t.hs.filter(h=>['NSE','BSE','US'].includes(h.type)).map(h=>h.cost));if(t.invested&&stocks/t.invested>.6)advice.push('Stocks represent more than 60% of invested capital. Check this against your own allocation target.');for(const type of ['Gold','Silver','Mutual Fund','US'])if(!t.hs.some(h=>h.type===type))advice.push('No '+label(type)+' holdings recorded. This is an allocation observation, not a reason to buy.');exposures().filter(h=>t.invested&&h.cost/t.invested>.4).forEach(h=>advice.push(h.name+' exceeds 40% of invested capital.'));const bear=Math.max(-99,rate-Math.max(5,Math.abs(rate)*.5)),bull=rate+Math.max(5,Math.abs(rate)*.4);return heading('Explore what’s ahead.','Scenarios to plan with. Never promises.')+(!db.lots.length?empty():`<div class="stack">${section('01 / Your future, in scenarios',`<div class="toolbar"><div><small>Assumed annual return</small><div class="num" style="font-size:2.4rem" id="rateLabel">${rate}%</div></div><label class="field">Projection starts from<select id="forecastBase"><option value="current" ${forecastBase==='current'?'selected':''}>Current value</option><option value="invested" ${forecastBase==='invested'?'selected':''}>Invested amount</option></select></label></div><input type="range" id="rateSlider" min="-30" max="80" step=".5" value="${rate}" aria-label="Annual return assumption"><div class="pills section">${[[annual!==null?annual*100:12,'Portfolio XIRR'],[8,'8%'],[12,'12%'],[15,'15%'],[20,'20%']].map(([v,n])=>`<button data-action="rate" data-id="${Math.max(-30,Math.min(80,v))}">${n}</button>`).join('')}</div><div id="scenarioTable">${scenarioTable(base,bear,bull)}</div><p class="footnote">Compound growth without new contributions, taxes or fees. Bear = base minus max(5 points, 50% of |rate|); bull = base plus max(5 points, 40% of |rate|). Labels retain their order for negative rates.</p><h3 class="section">Observed market growth</h3>${periodStrip(historyRows())}`)}${section('02 / Break-even extrapolation',t.hs.filter(h=>h.pnl<0).map(h=>`<div class="row"><div><strong>${esc(h.name)}</strong><br><small>${money(h.pnl)} below cost</small></div><strong class="num">${h.change>0?Math.ceil(-h.pnl/h.change)+' trading days':'∞ / unavailable'}</strong></div>`).join('')||'<p class="muted">No open holdings currently below cost.</p>'+'') }<p class="footnote">Break-even divides current loss by the latest positive daily rupee move. It assumes that move repeats; it is not a recovery forecast.</p>${section('03 / Allocation observations',advice.map(s=>`<div class="notice">${esc(s)}</div>`).join('')||'<p class="muted">No concentration rules triggered.</p>')}${section('04 / XIRR leaderboard',leader.map((h,i)=>`<div class="row"><div class="asset"><span class="avatar">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><div class="asset-name"><strong>${esc(h.name)}</strong><small>${days(h.buyDate)} days · ${money(h.pnl)} unrealized</small></div></div><strong class="num ${sign(h.xirr||0)}">${pct(h.xirr===null?NaN:h.xirr*100)}</strong></div>`).join(''))}${section('05 / Concentration by holding',bars(exposures().sort((a,b)=>b.cost-a.cost).map(h=>({name:h.name,value:t.invested?h.cost/t.invested*100:0,color:h.cost/t.invested>.4?'var(--down)':h.cost/t.invested>.2?'var(--gold)':'var(--accent)'})),v=>v.toFixed(1)+'%'))}${section('06 / Profit booking & exploratory trend',booking(),false)}</div>`);}
function scenarioTable(base,bear=rate-Math.max(5,Math.abs(rate)*.5),bull=rate+Math.max(5,Math.abs(rate)*.4)){return `<div class="scroll section"><table><thead><tr><th>Horizon</th><th>Bear ${bear.toFixed(1)}%</th><th>Base ${rate.toFixed(1)}%</th><th>Bull ${bull.toFixed(1)}%</th></tr></thead><tbody>${[1,3,5,10].map(y=>`<tr><td>${y} year${y>1?'s':''}</td>${[bear,rate,bull].map(r=>`<td class="num">${money(base*Math.pow(1+r/100,y))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function periodStrip(rows){return `<div class="growth-chips section">${[['Day',1],['Week',7],['Month',30],['Year',365],['Max','Max']].map(([name,n])=>{const r=periodReturn(rows,n);return `<div class="growth-chip"><small>${name}</small><strong class="num ${sign(r||0)}">${pct(r??NaN)}</strong></div>`;}).join('')}</div><p class="footnote">Cash-flow-adjusted daily returns, geometrically linked. Incomplete history shows —.</p>`;}
function realizedView(){const gains=db.sales.map(s=>({...s,pnl:salePnl(s),lot:db.lots.find(h=>h.id===s.lotId)})),total=sum(gains.map(s=>s.pnl)),wins=gains.filter(s=>s.pnl>=0).length,monthly={};gains.forEach(s=>monthly[s.date.slice(0,7)]=(monthly[s.date.slice(0,7)]||0)+s.pnl);return heading('Profits made tangible.','Your sales and investment income, recorded.')+`<div class="grid four">${metric('Realized P&L',money(total),'After recorded transaction fees',sign(total))}${metric('Sales completed',gains.length,db.lots.filter(h=>remaining(h)<1e-8).length+' fully closed positions')}${metric('Best sale',gains.length?money(Math.max(...gains.map(s=>s.pnl))):'—','Includes partial sales')}${metric('Win rate',gains.length?(wins/gains.length*100).toFixed(1)+'%':'—','Non-negative realized trades')}</div><div class="grid two section"><div class="card"><h2>Profit by sell month</h2>${bars(Object.entries(monthly).sort().map(([name,value])=>({name,value})))}</div><div class="card"><h2>Win / loss</h2><div class="spacer"></div>${donut([{name:'Profitable / break-even',value:wins},{name:'Loss-making',value:gains.length-wins}])}</div></div><section class="card section"><h2>P&L per trade</h2>${bars(gains.map(s=>({name:(s.lot?.name||'Asset')+' · '+s.date,value:s.pnl})))}</section><section class="card section"><div class="card-head"><h2>Trade journal</h2><button data-action="csv">Export CSV ↓</button></div>${gains.length?[...gains].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="row"><div class="asset-name"><strong>${esc(s.lot.name)} <span class="pill">${qty(s.units)} units</span></strong><small>${money(s.lot.buyPrice,s.lot.type==='US'?'USD':'INR')} → ${money(s.price,s.lot.type==='US'?'USD':'INR')} · ${shortDate(s.date)}</small>${s.notes?'<p class="footnote">'+esc(s.notes)+'</p>':''}</div><div class="right"><strong class="num ${sign(s.pnl)}">${money(s.pnl)}</strong><small>${pct(s.pnl/(s.units*unitBasis(s.lot))*100)}</small><br><button class="ghost" data-action="undo-sale" data-id="${s.id}" style="font-size:.7rem">Undo sale</button></div></div>`).join(''):'<div class="empty"><h3>Your completed sales will appear here.</h3><p>Use Sell on a holding to record a full or partial exit.</p></div>'}</section><section class="card section"><div class="card-head"><h2>Dividends & income</h2><strong class="num">${money(sum(db.dividends.map(d=>d.amount)))}</strong></div>${db.dividends.map(d=>`<div class="row"><div><strong>${esc(db.lots.find(h=>h.id===d.lotId)?.name||'Portfolio')}</strong><br><small>${shortDate(d.date)} · ${esc(d.notes)}</small></div><span class="up num">${money(d.amount)} <button class="ghost" data-action="delete-income" data-id="${d.id}" aria-label="Delete income">×</button></span></div>`).join('')||'<p class="muted">Record income from any holding’s detail view.</p>'}</section>`;}
function openModal(title,html,wide=false){lastFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.toggle('wide',wide);if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0;}
function closeModal(){$('modal').close();lastFocus?.focus?.();}
function field(name,title,value='',type='text',extra=''){return `<label class="field">${title}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function formError(e){const el=$('formError');if(el)el.textContent=e.message||e;else toast(e.message||e);}
function addSheet(id){const h=id?db.lots.find(x=>x.id===id):null;openModal(h?'Edit investment':'Add an investment',`<form id="investmentForm" data-id="${id||''}"><div class="form-grid"><label class="field full">Asset type<select name="type" id="assetType">${TYPES.map(t=>`<option ${h?.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field full">Find a stock or mutual fund<input id="assetLookup" placeholder="Search a name, or enter the symbol below" autocomplete="off"></label><div class="field full results" id="lookupResults"></div>${field('name','Investment name',h?.name||'','text','required maxlength="120"')}${field('symbol','Symbol / MF scheme code',h?.symbol||'','text','required maxlength="50"')}${field('units','Units (grams for physical metals)',h?.units||'','number','required min="0.000001" step="any"')}${field('buyPrice','Buy price per unit (USD for US)',h?.buyPrice||'','number','required min="0.000001" step="any"')}${field('buyDate','Purchase date',h?.buyDate||nowDate(),'date',`required max="${nowDate()}" min="1900-01-01"`)}${field('buyFx','Purchase USD/INR (US only)',h?.buyFx||cfg.usd||1,'number','required min="0.000001" step="any"')}${field('fees','Total purchase fees (INR)',h?.fees||0,'number','min="0" step="any"')}${!h?field('current','Current price (optional)', '', 'number','min="0.000001" step="any"'):''}<label class="field full">Notes<textarea name="notes" maxlength="1000">${esc(h?.notes||'')}</textarea></label></div><div class="notice">One entry represents one purchase lot. Add another investment for your next SIP or purchase. US purchases need the actual USD/INR rate paid.${h?' Existing sales are preserved; original units cannot be less than units already sold.':''}</div><p class="form-error" id="formError" role="alert"></p><div class="form-actions"><button type="button" data-action="close">Cancel</button><button class="primary">${h?'Save changes':'Add investment'}</button></div></form>`);assetTypeChange(false);}
function assetTypeChange(clear=true){const f=$('investmentForm'),t=f.elements.namedItem('type').value;f.elements.namedItem('buyFx').disabled=t!=='US';if(t!=='US')f.elements.namedItem('buyFx').value=1;else if(clear)f.elements.namedItem('buyFx').value=cfg.usd||'';$('assetLookup').disabled=['Gold','Silver','Other'].includes(t);if(clear){$('lookupResults').innerHTML='';for(const k of ['name','symbol'])f.elements.namedItem(k).value=['Gold','Silver'].includes(t)?t:'';}}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(dateMs(d))&&iso(dateMs(d))===d&&d>='1900-01-01'&&d<=nowDate();}
function saveInvestment(f){const v=Object.fromEntries(new FormData(f)),id=f.dataset.id,existing=db.lots.find(h=>h.id===id);let symbol=v.symbol.trim();if(v.type==='NSE'&&!symbol.endsWith('.NS'))symbol=symbol.toUpperCase()+'.NS';if(v.type==='BSE'&&!symbol.endsWith('.BO'))symbol=symbol.toUpperCase()+'.BO';if(v.type==='US')symbol=symbol.toUpperCase();const h={id:id||uid(),name:v.name.trim(),symbol,type:v.type,units:+v.units,buyPrice:+v.buyPrice,buyFx:v.type==='US'?+v.buyFx:1,buyDate:v.buyDate,fees:+v.fees||0,notes:v.notes.trim()};if(!h.name||!h.symbol||!TYPES.includes(h.type)||![h.units,h.buyPrice,h.buyFx].every(n=>Number.isFinite(n)&&n>0)||!Number.isFinite(h.fees)||h.fees<0||!validDate(h.buyDate))throw Error('Enter a name, symbol, positive units/prices and a valid purchase date.');const sales=db.sales.filter(s=>s.lotId===id);if(sum(sales.map(s=>s.units))>h.units+1e-8)throw Error('Original units cannot be less than units already sold.');if(db.dividends.some(d=>d.lotId===id&&d.date<h.buyDate))throw Error('Purchase date must be on or before recorded income.');if(sales.some(s=>s.date<h.buyDate))throw Error('Purchase date must be on or before all recorded sales.');if(existing&&sales.length&&(h.type!==existing.type||h.symbol!==existing.symbol))throw Error('An asset with sales cannot change its symbol or type.');mutate(n=>{if(existing)n.lots[n.lots.findIndex(x=>x.id===id)]=h;else n.lots.push(h);if(v.current&&+v.current>0)n.quotes[key(h)]={price:+v.current,previous:null,date:nowDate(),source:'Manual',updatedAt:new Date().toISOString()};});closeModal();toast('Investment saved on this device.');}
function sellSheet(id){const h=holding(db.lots.find(x=>x.id===id));openModal('Record a sale',`<form id="sellForm" data-id="${h.id}"><div class="asset"><div class="avatar">${esc(h.symbol.slice(0,2))}</div><div><h3>${esc(h.name)}</h3><small>${qty(h.units)} units available</small></div></div><div class="pills section"><button type="button" class="selected" data-action="sell-mode" data-id="all">Sell all</button><button type="button" data-action="sell-mode" data-id="partial">Partial sale</button></div><div class="form-grid section">${field('units','Units to sell',h.units,'number',`required min="0.000001" max="${h.units}" step="any"`)}${field('price','Sell price ('+(h.type==='US'?'USD':'INR')+')',h.price,'number','required min="0" step="any"')}${field('date','Sell date',nowDate(),'date',`required min="${h.buyDate}" max="${nowDate()}"`)}${field('fx','Sell USD/INR',h.fx,'number',`required min="0.000001" step="any" ${h.type!=='US'?'readonly':''}`)}${field('fees','Sale fees (INR)',0,'number','min="0" step="any"')}<label class="field full">Notes<textarea name="notes" maxlength="1000"></textarea></label></div><div id="sellPreview" class="notice"></div><p class="form-error" id="formError" role="alert"></p><div class="form-actions"><button type="button" data-action="close">Cancel</button><button class="primary">Confirm sale</button></div></form>`);sellPreview();}
function sellPreview(){const f=$('sellForm'),h=holding(db.lots.find(x=>x.id===f.dataset.id)),v=Object.fromEntries(new FormData(f)),cost=+v.units*unitBasis(h),proceeds=+v.units*+v.price*+v.fx-(+v.fees||0);$('sellPreview').innerHTML=`<div class="mini"><div><small>Cost basis</small><strong>${money(cost)}</strong></div><div><small>Net proceeds</small><strong>${money(proceeds)}</strong></div><div><small>Realized P&L</small><strong class="${sign(proceeds-cost)}">${money(proceeds-cost)}</strong></div></div><p class="footnote">Remaining: ${qty(Math.max(0,h.units-+v.units))} units</p>`;}
function saveSale(f){const v=Object.fromEntries(new FormData(f)),h=db.lots.find(x=>x.id===f.dataset.id),s={id:uid(),lotId:h.id,units:+v.units,price:+v.price,fx:h.type==='US'?+v.fx:1,fees:+v.fees||0,date:v.date,notes:v.notes};if(!Number.isFinite(s.units)||s.units<=0||s.units>remaining(h)+1e-8||!Number.isFinite(s.price)||s.price<0||!Number.isFinite(s.fx)||s.fx<=0||!Number.isFinite(s.fees)||s.fees<0||!validDate(s.date)||s.date<h.buyDate)throw Error('Check the sale units, price, FX rate and date.');mutate(n=>n.sales.push(s));closeModal();toast('Sale recorded. Remaining units and realized gains updated.');}
function priceSheet(id){const h=db.lots.find(x=>x.id===id),q=quote(h);openModal('Update price',`<form id="priceForm" data-id="${id}"><p class="muted">${esc(h.name)} · price per unit${['Gold','Silver'].includes(h.type)?' / gram':''}</p><div class="form-grid section">${field('price','Current price ('+(h.type==='US'?'USD':'INR')+')',q?.price||'','number','required min="0.000001" step="any"')}${field('previous','Previous close (optional)',q?.previous||'','number','min="0.000001" step="any"')}${field('date','Price date',nowDate(),'date',`required max="${nowDate()}"`)}</div><p class="form-error" id="formError"></p><div class="form-actions"><button class="primary">Save price</button></div></form>`);}
let detailId='',detailRange='1Y';
let perfRange='Max',perfZoom=1,perfPan=100;

function detailSheet(id,r='1Y'){detailId=id;detailRange=r;const h=holding(db.lots.find(x=>x.id===id)),t=totals(),hist=inRange(db.history[key(h)]||[],r),meta=h.q?.meta||{},monthly={};for(const p of db.history[key(h)]||[])if(p.date>=h.buyDate)monthly[p.date.slice(0,7)]=p;openModal(h.name,`<div class="toolbar"><div><span class="pill">${esc(h.type)} · ${esc(h.symbol)}</span><div class="num" style="font-size:2.5rem;margin-top:.5rem">${money(h.price,h.type==='US'?'USD':'INR')}</div><span class="${sign(h.changePct||0)} num">${pct(h.changePct)} <small>vs previous close</small></span></div><div class="actions"><button data-action="refresh-detail" data-id="${id}">↻ Refresh</button><button data-action="income" data-id="${id}">+ Income</button><button data-action="price" data-id="${id}">Set price</button></div></div><p class="footnote">${h.estimated?'Purchase price estimate':esc(h.q.source)+' · '+esc(h.q.date)}</p><div class="grid three section">${metric('Invested',money(h.cost))}${metric('Current value',money(h.value))}${metric('Unrealized P&L',money(h.pnl),pct(h.returnPct),sign(h.pnl))}${metric('Units',qty(h.units))}${metric('Average cost',money(unitBasis(h)),'INR per unit including fees')}${metric('Holding period',days(h.buyDate)+' days',shortDate(h.buyDate))}</div><div class="card section"><div class="card-head"><h2>Price history</h2>${ranges('detail-range',r,['7D','1M','3M','6M','1Y','2Y','5Y','Max'])}</div>${h.type==='Other'?'<p class="muted">Manual asset. Price history is only available for dates you record.</p>':''}${svgLine(hist,[{field:'price',color:'var(--accent)',label:'Price'}])}<small>${h.type==='US'?'USD':'INR'} per unit. Metal prices are indicative spot estimates, not retail quotes.</small></div><div class="grid two section"><div class="card"><h2>Price P&L since purchase</h2>${bars(Object.entries(monthly).map(([name,p])=>({name,value:(p.price-h.buyPrice)*h.units})),v=>money(v,h.type==='US'?'USD':'INR'))}<p class="footnote">Monthly price-only P&L on remaining units; excludes FX changes and fees.</p></div><div class="card"><h2>Portfolio share</h2><div class="num section" style="font-size:2rem">${t.value?(h.value/t.value*100).toFixed(1):0}%</div><div class="bar-track section"><div class="bar-fill" style="width:${t.value?h.value/t.value*100:0}%"></div></div><p class="footnote">Rank #${[...t.hs].sort((a,b)=>b.value-a.value).findIndex(x=>x.id===id)+1} by current value</p><h3 class="section">Key statistics</h3>${Object.entries({'52-week high':meta.fiftyTwoWeekHigh,'52-week low':meta.fiftyTwoWeekLow,'Market cap':meta.marketCap,'P/E ratio':meta.trailingPE,'Volume':meta.regularMarketVolume,'Average volume':meta.averageDailyVolume3Month,'Fund house':meta.fund_house}).map(([k,v])=>`<div class="row"><small>${k}</small><span class="num">${v===undefined?'—':typeof v==='number'?qty(v):esc(v)}</span></div>`).join('')}<p class="footnote">Unavailable provider fields show —.</p></div></div><section class="card section"><h2>1-year benchmark comparison</h2><div id="benchmark" class="section"><button data-action="benchmark" data-id="${id}">Load matched-period comparison</button><p class="footnote">Nifty 50 for Indian stocks; S&P 500 for US stocks. Uses local-currency price returns, not your money-weighted return. No unsupported fund-category benchmark is invented.</p></div></section><section class="card section"><h2>Latest news</h2><div id="news" class="section"><button data-action="news" data-id="${id}">Load available articles</button></div></section>${h.notes?'<div class="notice">'+esc(h.notes)+'</div>':''}`,true);}
function performance(r='Max'){perfRange=r;perfZoom=1;perfPan=100;const rows=historyRows(),t=totals(),part=inRange(rows,r);openModal('Portfolio performance',`<div class="grid three">${metric('Open cost basis',money(t.invested))}${metric('Current value',money(t.value),t.estimated?'Includes purchase-price estimates':'Latest available prices')}${metric('Unrealized P&L',money(t.pnl),pct(t.invested?t.pnl/t.invested*100:0),sign(t.pnl))}</div><div class="card-head section">${ranges('performance-range',r)}<button data-action="history-csv">Export daily data ↓</button></div><div id="performanceChart">${svgLine(part,undefined,300)}</div><div class="form-grid"><label class="field">Chart zoom<input id="perfZoom" type="range" min="1" max="12" value="1" step=".5"></label><label class="field">Pan through history<input id="perfPan" type="range" min="0" max="100" value="100"></label></div>${periodStrip(rows)}<p class="footnote">Charts leave gaps where any open holding or historical FX rate is missing. Sale proceeds are treated as withdrawals; income is treated as distributed. Purchase/sale-day return timing is approximated.</p><h3 class="section">Contributions in this range</h3><div class="pills section">${db.lots.filter(h=>!part.length||h.buyDate>=part[0].date).map(h=>`<span class="pill">+${money(h.units*unitBasis(h))} ${esc(h.name)} · ${h.buyDate}</span>`).join('')||'<small>No purchases in this range.</small>'}</div><div class="scroll section" style="max-height:32rem"><table><thead><tr><th>Date</th><th>Previous close value</th><th>Portfolio value</th><th>Market P&L¹</th><th>Return¹</th></tr></thead><tbody>${[...rows].reverse().map(d=>`<tr class="${d.date===nowDate()?'today':''}"><td>${d.date===nowDate()?'● Today · ':''}${shortDate(d.date)}</td><td class="num">${money(d.open)}</td><td class="num">${money(d.value)}<br><small>${d.valid?money(d.value-d.invested)+' vs cost':'History incomplete'}</small></td><td class="num ${sign(d.change||0)}">${money(d.change)}</td><td class="num ${sign(d.return||0)}">${pct(d.return===null?NaN:d.return*100)}</td></tr>`).join('')}</tbody></table></div><p class="footnote">¹ Value change minus purchases plus net sale proceeds plus distributed income. All calendar days are included; closed-market days carry forward the latest known close.</p>`,true);}

async function getJSON(url,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);try{const r=await fetch(url,{...options,signal:controller.signal});if(!r.ok)throw Error('Price provider returned HTTP '+r.status);const json=await r.json();if(json.error)throw Error(typeof json.error==='string'?json.error:'Provider error');return json;}catch(e){if(e.name==='AbortError')throw Error('Request timed out. Try again later.');throw e;}finally{clearTimeout(timeout);}}
function validGateway(url){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[\w-]+\/exec$/.test(u.pathname);}catch{return false;}}
async function gateway(action,params={}){if(!validGateway(cfg.url))throw Error('Connect the included Google Apps Script in Settings to retrieve stock prices. Manual prices work immediately.');const u=new URL(cfg.url);u.searchParams.set('action',action);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);return getJSON(u.href);}
async function lookup(){const f=$('investmentForm');if(!f)return;const search=$('assetLookup').value.trim(),type=f.elements.namedItem('type').value;if(search.length<2){$('lookupResults').innerHTML='';return;}const token=uid();lookup.token=token;$('lookupResults').innerHTML='<small>Searching…</small>';try{let results;if(type==='Mutual Fund'){const data=await getJSON('https://api.mfapi.in/mf/search?q='+encodeURIComponent(search));results=data.slice(0,12).map(i=>({name:i.schemeName,symbol:String(i.schemeCode)}));}else{const data=await gateway('search',{q:search});results=(data.quotes||[]).filter(q=>type==='NSE'?q.symbol.endsWith('.NS'):type==='BSE'?q.symbol.endsWith('.BO'):!q.symbol.includes('.')).slice(0,12).map(q=>({name:q.longname||q.shortname||q.symbol,symbol:q.symbol,exchange:q.exchDisp||q.exchange}));}if(lookup.token!==token||!$('lookupResults'))return;lookup.results=results;$('lookupResults').innerHTML=results.map((q,i)=>`<button type="button" data-action="select-search" data-id="${i}">${esc(q.name)}<small>${esc(q.symbol)} · ${esc(q.exchange||type)}</small></button>`).join('')||'<small>No matches. You can enter the name and symbol manually.</small>';}catch(e){if($('lookupResults'))$('lookupResults').innerHTML='<small>'+esc(e.message)+'</small>';}}
async function selectSearch(index){const q=lookup.results[+index],f=$('investmentForm');if(!q||!f)return;f.elements.namedItem('name').value=q.name;f.elements.namedItem('symbol').value=q.symbol;$('lookupResults').innerHTML='';$('assetLookup').value=q.name;const type=f.elements.namedItem('type').value;try{const result=await fetchAsset({type,symbol:q.symbol},false);if($('investmentForm')!==f)return;f.elements.namedItem('buyPrice').value=result.quote.price;if(f.elements.namedItem('current'))f.elements.namedItem('current').value=result.quote.price;toast('Latest price filled in. Check the actual price paid before saving.');}catch{toast('Selected. Enter your purchase price manually.');}}
async function fetchFx(){const data=await getJSON('https://api.frankfurter.dev/v2/rate/USD/INR');if(!(data.rate>0))throw Error('Invalid USD/INR rate');return {rate:data.rate,date:data.date};}
async function fetchAsset(h,history=true){const updatedAt=new Date().toISOString();if(h.type==='Other')throw Error('Manual asset');if(h.type==='Mutual Fund'){const data=await getJSON('https://api.mfapi.in/mf/'+encodeURIComponent(h.symbol)+(history?'':'/latest'));const records=(data.data||[]).map(d=>({date:d.date.split('-').reverse().join('-'),price:+d.nav})).filter(d=>validDate(d.date)&&d.price>0).sort((a,b)=>a.date.localeCompare(b.date));if(!records.length)throw Error('No NAV returned');const latest=records.at(-1),year=records.filter(r=>r.date>=iso(dateMs(nowDate())-365*dayMs));return {quote:{price:latest.price,previous:records.at(-2)?.price||null,date:latest.date,source:'MFAPI • daily NAV',updatedAt,meta:{...data.meta,fiftyTwoWeekHigh:Math.max(...year.map(r=>r.price)),fiftyTwoWeekLow:Math.min(...year.map(r=>r.price))}},history:history?records:null};}if(['Gold','Silver'].includes(h.type)){let fx=cfg.usd;if(!fx){const r=await fetchFx();fx=r.rate;cfg.usd=fx;cfg.usdDate=r.date;if(!demo)writeSettings();}const data=await getJSON('https://api.gold-api.com/price/'+(h.type==='Gold'?'XAU':'XAG'));if(!(data.price>0))throw Error('No metal spot price returned');const duty=h.type==='Gold'?cfg.goldDuty:cfg.silverDuty;const date=data.updatedAt&&Number.isFinite(Date.parse(data.updatedAt))?new Date(data.updatedAt).toISOString().slice(0,10):nowDate();return {quote:{price:data.price*fx/31.1034768*(1+duty/100),previous:null,date,source:'Indicative INR spot/gram • Gold API + reference FX',updatedAt,meta:{}},history:null};}const data=await gateway('chart',{symbol:h.symbol,range:history?'max':'5d'}),r=data.chart?.result?.[0];if(!r)throw Error(data.chart?.error?.description||'Stock history unavailable');const closes=r.indicators?.quote?.[0]?.close||[],records=(r.timestamp||[]).map((t,i)=>({date:iso(t*1000),price:closes[i]})).filter(d=>Number.isFinite(d.price)&&d.price>0),meta=r.meta||{},latest=records.at(-1),price=meta.regularMarketPrice||latest?.price;if(!(price>0))throw Error('Provider returned no usable price');const date=meta.regularMarketTime?iso(meta.regularMarketTime*1000):latest?.date||nowDate();return {quote:{price,previous:meta.previousClose||records.filter(p=>p.date<date).at(-1)?.price||null,date,source:'Yahoo Finance • delayed / last available',updatedAt,meta},history:history?records:null};}
async function refreshPrices(onlyId){if(busy)return;const assets=onlyId?[db.lots.find(h=>h.id===onlyId)]:[...new Map(db.lots.map(h=>[key(h),h])).values()];if(!assets.length){toast('Add an investment first.');return;}if(demo){toast('Demo prices are illustrative. Exit demo for real price updates.');return;}busy=true;toast('Updating prices and history…');const n=structuredClone(db),errors=[];try{if(assets.some(h=>['US','Gold','Silver'].includes(h.type))){try{const fx=await fetchFx();cfg.usd=fx.rate;cfg.usdDate=fx.date;writeSettings();}catch{errors.push('USD/INR: retained previous reference rate');}}for(let i=0;i<assets.length;i+=3){await Promise.all(assets.slice(i,i+3).map(async h=>{if(h.type==='Other')return;try{const r=await fetchAsset(h);n.quotes[key(h)]=r.quote;if(r.history)n.history[key(h)]=r.history;else if(['Gold','Silver'].includes(h.type)){const points=n.history[key(h)]||[];n.history[key(h)]=[...points.filter(p=>p.date!==r.quote.date),{date:r.quote.date,price:r.quote.price}].sort((a,b)=>a.date.localeCompare(b.date));}}catch(e){errors.push(h.symbol+': '+e.message);}}));}if(assets.some(h=>h.type==='US')){try{const start=db.lots.filter(h=>h.type==='US').reduce((d,h)=>h.buyDate<d?h.buyDate:d,nowDate());const fx=await getJSON('https://api.frankfurter.dev/v2/rates?base=USD&quotes=INR&from='+iso(dateMs(start)-7*dayMs));n.fxHistory=fx.map(d=>({date:d.date,price:d.rate})).filter(d=>d.price>0).sort((a,b)=>a.date.localeCompare(b.date));}catch{errors.push('Historical FX unavailable; US history may have gaps.');}}// Preserve any transactions edited while prices were loading.
const fresh=structuredClone(db);fresh.quotes={...fresh.quotes,...n.quotes};fresh.history={...fresh.history,...n.history};fresh.fxHistory=n.fxHistory;commit(fresh);if(onlyId&&$('modal').open)detailSheet(onlyId,detailRange);toast(errors.length?'Updated available data. '+errors.length+' source(s) need attention.':'Prices and available history updated.');if(errors.length){openModal('Price update report',`<p class="muted">Existing prices are retained when a source fails. Enter a manual price from the holding if needed.</p>${errors.map(e=>'<div class="notice">'+esc(e)+'</div>').join('')}<button data-action="settings">Open connection settings</button>`);}}finally{busy=false;}}
async function benchmark(id){const h=db.lots.find(h=>h.id===id);if(!['NSE','BSE','US'].includes(h.type)){$('benchmark').innerHTML='<p class="muted">A comparable benchmark is not configured for this asset type.</p>';return;}try{$('benchmark').textContent='Loading benchmark…';const b=await gateway('chart',{symbol:h.type==='US'?'^GSPC':'^NSEI',range:'1y'}),r=b.chart?.result?.[0];if(!r)throw Error('Benchmark unavailable');const prices=r.indicators.quote[0].close,points=r.timestamp.map((t,i)=>({date:iso(t*1000),price:prices[i]})).filter(p=>p.price>0),hist=db.history[key(h)]||[],common=points.filter(p=>hist.some(h=>h.date===p.date));if(common.length<2)throw Error('Refresh this holding’s history first.');const first=common[0],last=common.at(-1),ownStart=hist.find(p=>p.date===first.date).price,ownEnd=hist.find(p=>p.date===last.date).price;const own=(ownEnd/ownStart-1)*100,bench=(last.price/first.price-1)*100;if($('benchmark'))$('benchmark').innerHTML=bars([{name:h.name,value:own},{name:h.type==='US'?'S&P 500':'Nifty 50',value:bench}],pct)+`<p class="footnote">Matched ${first.date} to ${last.date}. Price return in local currency; dividends excluded.</p>`;}catch(e){if($('benchmark'))$('benchmark').textContent=e.message;}}
async function news(id){const h=db.lots.find(h=>h.id===id);try{$('news').textContent='Loading articles…';const r=await gateway('search',{q:h.symbol}),items=(r.news||[]).slice(0,5);if($('news'))$('news').innerHTML=items.map(n=>{let u;try{u=new URL(n.link);if(u.protocol!=='https:')return '';}catch{return '';}return `<div class="row"><div><a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><br><small>${esc(n.publisher)}</small></div><span>↗</span></div>`;}).join('')||'<p class="muted">No articles returned by the provider.</p>';}catch(e){if($('news'))$('news').textContent=e.message;}}
function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportBackup(){download('folio-backup-'+nowDate()+'.json',JSON.stringify({app:'folio-fresh',exportedAt:new Date().toISOString(),data:db},null,2));toast('Backup exported. Connection secrets are not included.');}
const csvCell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
function csvExport(history=false){let rows;if(history){rows=[['Date','Portfolio INR','Cost basis INR','Market change INR','Market return'],...historyRows().map(r=>[r.date,r.value,r.invested,r.change,r.return])];}else{rows=[['Record','ID','Asset','Type','Symbol','Date','Units','Price','FX INR','Fees INR','Notes'],...db.lots.map(h=>['BUY',h.id,h.name,h.type,h.symbol,h.buyDate,h.units,h.buyPrice,h.buyFx,h.fees,h.notes]),...db.sales.map(s=>{const h=db.lots.find(h=>h.id===s.lotId);return ['SELL',s.id,h.name,h.type,h.symbol,s.date,s.units,s.price,s.fx,s.fees,s.notes];}),...db.dividends.map(d=>['INCOME',d.id,db.lots.find(h=>h.id===d.lotId)?.name,'','',d.date,'',d.amount,1,0,d.notes])];}download('folio-'+(history?'history':'transactions')+'-'+nowDate()+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function validateData(value){const n=structuredClone(value?.data||value);if(!n||n.version!==VERSION||!Array.isArray(n.lots)||!Array.isArray(n.sales)||!Array.isArray(n.dividends)||!n.quotes||typeof n.quotes!=='object'||!n.history||typeof n.history!=='object')throw Error('This is not a Folio Fresh backup. Other formats need conversion before import.');if(n.lots.length>2000||n.sales.length>20000)throw Error('Backup is too large (maximum 2,000 purchase lots).');const ids=new Set();for(const h of n.lots){if(typeof h.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(h.id)||ids.has(h.id)||typeof h.name!=='string'||h.name.length>120||!h.name||typeof h.symbol!=='string'||!h.symbol||h.symbol.length>50||!TYPES.includes(h.type)||![h.units,h.buyPrice,h.buyFx].every(v=>typeof v==='number'&&Number.isFinite(v)&&v>0)||!Number.isFinite(h.fees)||!Number.isFinite(h.fees)||h.fees<0||!validDate(h.buyDate))throw Error('Invalid or duplicate investment in backup.');ids.add(h.id);h.notes=String(h.notes||'').slice(0,1000);}const saleIds=new Set();for(const s of n.sales){const h=n.lots.find(h=>h.id===s.lotId);if(!h||typeof s.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(s.id)||saleIds.has(s.id)||![s.units,s.price,s.fx,s.fees].every(v=>typeof v==='number'&&Number.isFinite(v))||s.units<=0||s.price<0||s.fx<=0||!Number.isFinite(s.fees)||s.fees<0||!validDate(s.date)||s.date<h.buyDate)throw Error('Invalid sale in backup.');saleIds.add(s.id);s.notes=String(s.notes||'').slice(0,1000);}for(const h of n.lots)if(sum(n.sales.filter(s=>s.lotId===h.id).map(s=>s.units))>h.units+1e-8)throw Error('Backup sells more units than were purchased.');const incomeIds=new Set();for(const d of n.dividends){if(typeof d.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(d.id)||incomeIds.has(d.id)||!ids.has(d.lotId)||!Number.isFinite(d.amount)||d.amount<=0||!validDate(d.date)||d.date<n.lots.find(h=>h.id===d.lotId).buyDate)throw Error('Invalid income in backup.');incomeIds.add(d.id);d.notes=String(d.notes||'').slice(0,1000);}for(const q of Object.values(n.quotes)){if(!Number.isFinite(q.price)||q.price<=0||!validDate(q.date))throw Error('Invalid stored price.');if(q.previous!==null&&q.previous!==undefined&&(!Number.isFinite(q.previous)||q.previous<=0))throw Error('Invalid previous close.');q.source=String(q.source||'Imported');}for(const records of [...Object.values(n.history),n.fxHistory||[]]){if(!Array.isArray(records)||records.some(p=>!validDate(p.date)||!Number.isFinite(p.price)||p.price<=0))throw Error('Invalid historical price.');records.sort((a,b)=>a.date.localeCompare(b.date));}n.fxHistory=n.fxHistory||[];return {version:VERSION,lots:n.lots,sales:n.sales,dividends:n.dividends,quotes:n.quotes,history:n.history,fxHistory:n.fxHistory,updatedAt:n.updatedAt||null};}
