const C=(()=>{
const DAY=86400000;
const TYPES=['NSE','BSE','US','MF','Gold','Silver','Other'];
const today=()=>new Date().toISOString().slice(0,10);
const days=(date,end=today())=>Math.max(0,(Date.parse(end)-Date.parse(date))/DAY);
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&new Date(s).toISOString().slice(0,10)===s;}
function validateLot(h){
 if(!h.id||typeof h.name!=='string'||!h.name.trim()||h.name.length>160)throw Error('Enter a valid asset name.');
 if(!TYPES.includes(h.type))throw Error('Choose an asset type.');
 for(const k of ['units','buyPrice','buyFx'])if(!Number.isFinite(+h[k])||+h[k]<=0)throw Error(k+' must be greater than zero.');
 if(!validDate(h.buyDate)||h.buyDate>today())throw Error('Enter a valid purchase date, no later than today.');
 if(h.type==='US'&&h.currency!=='USD')throw Error('US positions must use USD.');
 if(h.manualPrice!=null&&(!Number.isFinite(+h.manualPrice)||+h.manualPrice<0))throw Error('Invalid manual price.');
 return h;
}
function replay(events){
 const lots=new Map(),trades=[],dividends=[],conflicts=[],seen=new Set();
 for(const e of [...events].sort((a,b)=>a.at.localeCompare(b.at)||a.id.localeCompare(b.id))){
  if(seen.has(e.id))continue;seen.add(e.id);
  try{
   if(e.kind==='settings'){const v=e.values;if(!v||typeof v.priceService!=='string'||(v.priceService&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v.priceService))||![v.goldDuty,v.silverDuty].every(n=>Number.isFinite(n)&&n>=0&&n<=100))throw Error('Invalid settings');continue;}
   if(e.kind==='batch'){for(const h of e.lots){validateLot(h);if(lots.has(h.id))continue;lots.set(h.id,{...h,version:e.id});}for(const t of e.trades||[])trades.push(t);continue;}
   const old=lots.get(e.lotId||e.lot?.id);
   if(e.kind==='price'){if(!old||old.type!=='Other'||!Number.isFinite(e.price)||e.price<0)throw Error('Invalid manual price');lots.set(old.id,{...old,manualPrice:e.price,version:e.id});}
   else if(e.kind==='buy'){validateLot(e.lot);if(old)throw Error('Duplicate position');lots.set(e.lot.id,{...e.lot,version:e.id});}
   else if(e.kind==='edit'||e.kind==='delete'||e.kind==='sell'){
    if(!old||old.version!==e.expected)throw Error('Position changed on another device. Review this transaction.');
    if(e.kind==='edit'){validateLot(e.lot);if(trades.some(t=>t.lotId===old.id))throw Error('Sold lots cannot be edited. Add a separate purchase.');lots.set(old.id,{...e.lot,version:e.id});}
    if(e.kind==='delete')lots.delete(old.id);
    if(e.kind==='sell'){
     if(!Number.isFinite(e.units)||e.units<=0||e.units>old.units+1e-8)throw Error('Sale exceeds available units.');
     if((e.fees!=null&&(!Number.isFinite(e.fees)||e.fees<0))||!Number.isFinite(e.price)||e.price<0||!Number.isFinite(e.fx)||e.fx<=0||!validDate(e.date)||e.date<old.buyDate||e.date>today())throw Error('Invalid sale details.');
     const units=Math.min(old.units,e.units),cost=units*old.buyPrice*old.buyFx,proceeds=units*e.price*e.fx-(e.fees||0);
     trades.push({...old,id:e.id,lotId:old.id,units,soldPrice:e.price,soldDate:e.date,sellFx:e.fx,fees:e.fees||0,cost,proceeds,pnl:proceeds-cost,notes:e.notes||''});
     if(old.units-units<1e-8)lots.delete(old.id);else lots.set(old.id,{...old,units:old.units-units,version:e.id});
    }
   }else if(e.kind==='dividend'){
    if(!Number.isFinite(e.amount)||e.amount<=0||!validDate(e.date)||e.date>today())throw Error('Invalid dividend.');dividends.push(e);
   }else throw Error('Unsupported event');
  }catch(error){conflicts.push({event:e,error:error.message});}
 }
 return {lots:[...lots.values()],trades,dividends,conflicts};
}
function position(h,prices={},fx=null){
 const q=prices[h.symbol],price=q?.price??h.manualPrice??null,rate=h.currency==='USD'?fx:1;
 const cost=h.units*h.buyPrice*h.buyFx,value=price!=null&&rate!=null?price*h.units*rate:null;
 const previous=q?.previous,change=value!=null&&previous!=null?(price-previous)*h.units*rate:null;
 return {...h,price,value,cost,pnl:value==null?null:value-cost,pct:value==null?null:(value/cost-1)*100,change,dayPct:previous>0?(price/previous-1)*100:null,age:days(h.buyDate),quote:q};
}
function summary(lots,prices,fx,trades=[],dividends=[]){
 const positions=lots.map(h=>position(h,prices,fx)),cost=positions.reduce((s,h)=>s+h.cost,0),known=positions.every(h=>h.value!=null),value=known?positions.reduce((s,h)=>s+h.value,0):null;
 const change=positions.length&&positions.every(h=>h.change!=null)?positions.reduce((s,h)=>s+h.change,0):null;
 const realized=trades.reduce((s,t)=>s+t.pnl,0),income=dividends.reduce((s,d)=>s+d.amount,0);
 return {positions,cost,value,pnl:value==null?null:value-cost,pct:value==null||!cost?null:(value/cost-1)*100,change,realized,income,total:value==null?null:value-cost+realized+income,hhi:cost?positions.reduce((s,h)=>s+(h.cost/cost)**2,0)*100:0};
}
function xirr(flows){
 if(flows.length<2||!flows.some(f=>f.amount<0)||!flows.some(f=>f.amount>0))return null;
 const start=Math.min(...flows.map(f=>Date.parse(f.date))),times=flows.map(f=>(Date.parse(f.date)-start)/DAY/365);
 if(Math.max(...times)===0)return null;
 const npv=r=>flows.reduce((s,f,i)=>s+f.amount/(1+r)**times[i],0);
 let lo=-.999999,hi=1;while(npv(lo)*npv(hi)>0&&hi<1e7)hi=hi*2+1;if(npv(lo)*npv(hi)>0)return null;
 for(let i=0;i<200;i++){let mid=(lo+hi)/2,v=npv(mid);if(Math.abs(v)<1e-7)return mid;if(npv(lo)*v>0)lo=mid;else hi=mid;}return (lo+hi)/2;
}
function portfolioFlows(state,s,end=today()){

 for(const t of state.trades){flows.push({date:t.buyDate,amount:-t.cost},{date:t.soldDate,amount:t.proceeds});}
 for(const d of state.dividends)flows.push({date:d.date,amount:d.amount});if(s.value!=null)flows.push({date:end,amount:s.value});return flows;
}
const holdingXirr=h=>h.value==null?null:xirr([{date:h.buyDate,amount:-h.cost},{date:today(),amount:h.value}]);
function project(principal,rate,years,monthly=0){

const SETUP_GUIDE="# Activate PORTFOL.IO\n\nThe interface runs on GitHub Pages. Private transactions sync through your Google account, not the public repository. Keep your original legacy HTML as a backup; this replacement never changes its Google Sheet.\n\n## 1. Enable your Google connection\n\nThe existing public OAuth client ID is preserved in `config.js`. No client secret is required or belongs in this repository.\n\n1. Open [Google Cloud Console](https://console.cloud.google.com/) and select the project that owns the existing sign-in client.\n2. Enable **Google Drive API** under APIs & Services → Library.\n3. In Google Auth Platform → Data Access, add `openid`, `email`, `profile`, and `https://www.googleapis.com/auth/drive.appdata`.\n4. In Clients, open the web client and ensure its Authorized JavaScript origins include `https://aadarshyvs.github.io` (origin only, no repository path). For local development add `http://localhost:4173`.\n5. If the OAuth app is in Testing, add your Google account as a test user. Testing status may require periodic reauthorization; follow Google's publishing requirements for longer-term use.\n6. Open PORTFOL.IO → **Connect Google** and approve access. Repeat on your phone using the same Google account. Both devices load the same events automatically.\n\nGoogle protects the app-data folder with the account's OAuth access. The frontend email allowlist is a convenience restriction, not a substitute for Google API authorization. Someone changing the public frontend cannot gain access to your account's data.\n\n## 2. Activate market data\n\n1. Open [Apps Script](https://script.google.com/) and create a new standalone project.\n2. Paste `services/PriceService.gs` into Code.gs. The app's Settings also has a Copy script button.\n3. Deploy → New deployment → Web app → Execute as **Me** → Who has access: **Anyone**. Authorize the script's external HTTP requests.\n4. Copy the `/exec` URL. In PORTFOL.IO Settings paste it, click **Test connection**, then **Save & refresh**.\n5. The URL and gold/silver conversion assumptions sync through your Google app storage after signing in. Theme stays device-local.\n\nThis endpoint only fetches public market data from fixed Yahoo hosts. It never receives Google access tokens, quantities, purchase prices, notes, or portfolio records. Requested symbols are visible to the market-data service. Apps Script and Yahoo quotas/outages can make prices unavailable; the UI reports missing data rather than inventing values. MFAPI provides direct daily mutual fund NAVs.\n\nThe legacy Apps Script cannot provide the new history/search protocol. Deploy this as a separate service so the old app continues working.\n\n## 3. Import your existing data\n\n1. Keep a backup of your existing Google Sheet.\n2. Connect Google in the new app.\n3. Open Settings → **Read legacy Sheets URL**, paste your existing data-service URL, then read holdings. This performs a read only.\n4. Alternatively use **Import legacy browser data** on the browser where the old app was used, or select a JSON export.\n5. Review the import preview and confirm. For USD lots supply actual historical `buyFx`; for closed USD positions also supply `sellFx`. The import refuses to guess those values.\n6. Export a v2 JSON backup. Compare active units, cost basis, and closed-trade totals to your original records before relying on analytics.\n\n## How sync works\n\nEvery purchase, edit, sale, dividend and settings change is a separate immutable JSON event in Google's private app-data folder. Saves await a successful Google response. Events are loaded on sign-in, on refresh, when returning to the app, and once a minute while it is visible. Refresh after signing in on another device to see the same portfolio. There are no private holdings embedded in source code.\n\nConcurrent edits on one lot use expected event versions. A stale sale/edit is excluded and exposed as a conflict rather than silently overselling. Events use device timestamps for deterministic ordering; device clocks should be correct. Cloud writes are online-only. If a request fails, the form remains open; retry after reconnecting. Google may save a request whose response was lost: refresh and inspect the ledger before retrying a purchase. The backend is an append-only event store, not a transactional trading system.\n\nThis single-file edition does not install a service worker. Reloading requires sign-in again; portfolio records and OAuth tokens are not retained on disk by this app.\n\n## Calculations and limits\n\n- Each purchase is its own tax lot; sales explicitly select the lot. The app is not a tax filing tool.\n- INR cost uses the actual purchase FX. Current value uses current FX. Sale proceeds use the entered sale FX and subtract recorded sale fees.\n- XIRR uses dated purchases, net sales, dividends and terminal portfolio value with a bracketed solver. Non-conventional cash flows may have ambiguous/multiple roots; interpret accordingly.\n- Historical portfolio reconstruction includes sold units until their sale date. External cash flows are excluded using a daily approximation. This is not exact intraday time-weighted performance.\n- Historical stock splits, mergers and adjusted/unadjusted provider-price inconsistencies require review. Corporate-action automation is not implemented.\n- Manual assets have a current price but no fabricated historical chart. Missing observations remain unavailable.\n- Gold/silver prices are indicative international futures converted to INR per gram, with configurable uplifts. They are not verified MCX or retail quotes, and preset uplifts are not assertions about current law.\n- Risk scores and health radar are explicitly labelled heuristics. Break-even calculations are one-day extrapolations. Scenario rates are assumptions; no market forecast is promised.\n- News, benchmarks, and key stats depend on provider availability. P/E, market cap, and mutual-fund category benchmarks may be unavailable.\n- Public CORS proxies were removed. The app uses Google's server-side market gateway and direct MFAPI calls.\n\n## Legacy features deliberately changed or not yet included\n\nThe replacement covers the five workspaces, portfolio and asset history, purchase/edit/delete, partial and full sales, XIRR, concentration, allocation, scenario planning, migration, and cross-device cloud events. It is not exact feature parity: chart pinch-zoom/pan, MCX/spot multi-provider metal fallback, automatic corporate actions, MF category benchmarks, and the regression-based unrealized/realized forecast bands are not implemented. Monthly realized history is shown as actual booked P&L, and future values are isolated in the scenario planner.\n\n## Development and recovery\n\nUpload this HTML file to an HTTPS static host. Rename it index.html if you want it to be the default page. No build or package installation is required. Google sign-in needs a registered HTTPS origin; a local file can show the demo but cannot use Google OAuth.\n\nKeep your original HTML and Google Sheet as backups. Do not delete the old Google Sheet until migration is reconciled. The GitHub Pages deployment continues from main with the existing repository settings.\n\nOfficial references: [Google app-data storage](https://developers.google.com/workspace/drive/api/guides/appdata), [Google browser token flow](https://developers.google.com/identity/oauth2/web/guides/use-token-model).\n";

const S={events:[],prices:{},histories:{},fxHistory:{},fx:null,demo:false,page:'home',range:'Max',filter:'All',query:'',rate:12,monthly:0,busy:false,errors:[],lastSync:null,historyLoading:false};
const market=new Market(prefs.priceService||config.priceService);
const names={home:['◫','Overview'],analytics:['▥','Analytics'],predictions:['⌁','Scenarios'],holdings:['▤','Holdings'],realized:['◎','Realized']};
const state=()=>C.replay(S.events),stats=()=>{const d=state();return C.summary(d.lots,S.prices,S.fx,d.trades,d.dividends);};
const rows=()=>C.history(state(),S.histories,S.fxHistory,S.prices,S.fx);
const rangeDays={'7D':7,'1W':7,'1M':30,'3M':90,'6M':180,'1Y':365,'2Y':730,'5Y':1825,Max:Infinity};
const section=(title,body,open=true)=>`<details class="panel" ${open?'open':''}><summary>${title}</summary><div>${body}</div></details>`;
const metric=(label,value,note='',cls='')=>`<article class="panel metric"><span class="label">${label}</span><strong class="${cls}">${value}</strong><small>${note}</small></article>`;
const badge=h=>`<span class="badge">${esc(h.type==='MF'?'MUTUAL FUND':h.type)}</span>`;
const asset=h=>`<button class="asset-cell" data-detail="${esc(h.id)}"><span class="asset-icon">${esc(h.name.slice(0,2).toUpperCase())}</span><span><strong>${esc(h.name)}</strong><small>${esc(h.symbol||h.type)} · ${num(h.units)} units</small></span></button>`;
const selectedRows=(range=S.range)=>rows().slice(-rangeDays[range]);
function toast(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>$('#toast').style.display='none',6500);}
function modal(title,body,wide=false){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').classList.toggle('wide',wide);if(!$('#modal').open)$('#modal').showModal();}
$('#close-modal').onclick=()=>$('#modal').close();
function theme(t){document.documentElement.dataset.theme=t;prefs.theme=t;localStorage.setItem('portfolio-v2-prefs',JSON.stringify(prefs));$('meta[name="theme-color"]').content=t==='dark'?'#0b0c14':'#f0ede6';}
theme(prefs.theme||'dark');$('#theme').onclick=()=>theme(prefs.theme==='dark'?'light':'dark');
function status(){const d=state();$('#sync-status').textContent=S.busy?'Syncing…':S.demo?'Demo portfolio · sample data':cloud.user?(d.conflicts.length?`${d.conflicts.length} transaction conflict(s) to review`:S.lastSync?'Cloud synced · '+new Date(S.lastSync).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Connected to Google'):'Connect Google for private cloud sync';$('#account').textContent=cloud.user?.email||'Private by design';$('#signin').textContent=cloud.user?'Sign out':'Connect Google';}
function render(){S.page=names[location.hash.slice(1)]?location.hash.slice(1):'home';$('#nav').innerHTML=Object.entries(names).map(([k,[icon,title]])=>`<a href="#${k}" class="${S.page===k?'active':''}" ${S.page===k?'aria-current="page"':''}><i aria-hidden="true">${icon}</i><span>${title}</span></a>`).join('');status();const d=state(),s=stats();let body=({home:home,analytics, predictions,holdings,realized}[S.page])(d,s);$('#main').innerHTML=`${S.demo?'<div class="notice"><strong>Demo mode</strong> — illustrative holdings and prices. Nothing here is your real portfolio. <button data-action="exit-demo" class="chip">Exit demo</button></div>':''}${d.conflicts.length?'<div class="notice"><strong>Sync conflict:</strong> a position changed on another device. Conflicting transactions were not applied. Review them in Settings.</div>':''}${body}`;bindMain();}
function heading(title,subtitle,extra=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${extra||'<button data-action="settings" aria-label="Settings">⚙</button>'}</div>`;}
function empty(){return `<div class="panel empty"><span class="badge gold">YOUR NEXT CHAPTER</span><h2>Give every investment a home.</h2><p>Stocks, funds, precious metals and everything in between. Connect your Google account to keep one portfolio across your phone and desktop.</p><div class="empty-actions"><button class="primary" data-action="connect">Connect with Google</button><button data-action="demo">Explore demo portfolio</button><button data-action="settings">Import or set up</button></div></div>`;}
function rangeTabs(action='range',value=S.range,list=['1W','1M','3M','6M','1Y','Max']){return `<div class="ranges" aria-label="Chart range">${list.map(r=>`<button data-${action}="${r}" aria-pressed="${r===value}" class="${r===value?'active':''}">${r}</button>`).join('')}</div>`;}
function home(d,s){if(!d.lots.length&&!d.trades.length)return heading('Your portfolio','A clearer picture of where you stand.')+empty();const best=[...s.positions].filter(h=>h.pct!=null).sort((a,b)=>b.pct-a.pct)[0],movers=[...s.positions].sort((a,b)=>(b.dayPct??-Infinity)-(a.dayPct??-Infinity)),last=[...d.lots,...d.trades].sort((a,b)=>b.buyDate.localeCompare(a.buyDate))[0],wins=s.positions.filter(h=>h.pnl>0).length;return heading('Your portfolio','Every asset. One clear picture.',`<span class="badge gold">INR · BASE CURRENCY</span>`)+`<div class="stack"><div class="grid two"><article class="panel hero"><div class="row"><button class="hero-label" data-action="performance">Total portfolio value ↗</button><span class="badge">${S.demo?'SAMPLE PRICES':S.errors.length?'PARTIAL PRICES':'LATEST AVAILABLE'}</span></div><div class="hero-value">${money(s.value)}</div><div class="hero-meta"><span class="number ${tone(s.pnl)}">${money(s.pnl)} (${pct(s.pct)})</span><span class="label">unrealized return</span></div><div class="row">${rangeTabs()}<button class="chip" data-action="performance">Explore performance ↗</button></div><div class="legend"><span>Portfolio value</span><span>Cost basis</span></div>${lineChart(selectedRows())}<div class="hero-footer"><div><span class="label">INVESTED</span><strong class="number">${money(s.cost)}</strong></div><div><span class="label">TODAY / LAST SESSION</span><strong class="number ${tone(s.change)}">${money(s.change)}</strong></div><div><span class="label">REALIZED</span><strong class="number ${tone(s.realized)}">${money(s.realized)}</strong></div><div><span class="label">POSITIONS</span><strong class="number">${s.positions.length}</strong></div></div></article><article class="panel"><div class="row"><h3>Asset allocation</h3><span class="label">By invested amount</span></div>${allocation(s.positions)}<div class="divider"></div><div class="row"><span class="label">Concentration · HHI</span><span class="number">${s.hhi.toFixed(0)} / 100</span></div></article></div><div class="grid four">${metric('Unrealized P&L',money(s.pnl),pct(s.pct)+' since purchase',tone(s.pnl))}${metric('Best return',best?pct(best.pct):'—',esc(best?.name||'Awaiting prices'),'positive')}${metric('Realized gains',money(s.realized),d.trades.length+' closed trades',tone(s.realized))}${metric('Total returns',money(s.total),`${wins} winners · ${s.positions.filter(h=>h.pnl<0).length} losers · includes income`,tone(s.total))}${metric('Today / last session',money(s.change),'Price movement; excludes intraday FX',tone(s.change))}${metric('Biggest daily move',movers[0]?pct(movers[0].dayPct):'—',esc(movers[0]?.name||'Awaiting prices'))}${metric('Last buy',last?money(last.units*last.buyPrice*last.buyFx):'—',esc(last?.name||'')+' · '+(last?.buyDate||''))}${metric('Income received',money(s.income),'Dividends & distributions')}</div>${S.errors.length?'<div class="notice">Some prices are unavailable: '+esc(S.errors.join(' · '))+'. Portfolio totals stay unavailable until all positions can be valued.</div>':''}<div><div class="row"><h3>Market movers</h3><a href="#holdings">All holdings ↗</a></div><div class="movers">${movers.map(h=>`<button class="mover" data-detail="${esc(h.id)}"><strong>${esc(h.name)}</strong><span class="number ${tone(h.dayPct)}">${pct(h.dayPct)}</span><small>${esc(h.quote?.date||'No market timestamp')}</small></button>`).join('')}</div></div><article class="panel"><div class="row"><h3>Your positions</h3><a href="#holdings">Manage portfolio ↗</a></div>${positionsTable(s.positions)}</article></div>`;}
function positionsTable(ps){return `<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Invested</th><th>Value</th><th>Return</th><th>Day change</th></tr></thead><tbody>${ps.map(h=>`<tr><td>${asset(h)}</td><td class="number">${money(h.cost)}</td><td class="number">${money(h.value)}</td><td class="number ${tone(h.pnl)}">${money(h.pnl)}<br><small>${pct(h.pct)}</small></td><td class="number ${tone(h.dayPct)}">${pct(h.dayPct)}</td></tr>`).join('')}</tbody></table></div>`;}
function holdings(d,s){const ps=s.positions.filter(h=>(S.filter==='All'||h.type===S.filter)&&(h.name+' '+h.symbol).toLowerCase().includes(S.query.toLowerCase()));return heading('Your holdings','Built one investment at a time.',`<button class="primary" data-action="add">＋ Add investment</button>`)+`<div class="toolbar"><div class="ranges">${['All',...C.TYPES].map(t=>`<button data-filter="${t}" class="${S.filter===t?'active':''}">${t==='MF'?'Mutual funds':t}</button>`).join('')}</div><input id="holding-search" aria-label="Search holdings" placeholder="Search your holdings…" value="${esc(S.query)}"></div><div class="grid three">${ps.map(h=>`<article class="panel holding"><div class="row">${asset(h)}${badge(h)}</div><div class="row"><div><span class="label">Current value</span><div class="holding-value number">${money(h.value)}</div></div><div class="number ${tone(h.pnl)}">${money(h.pnl)}<br><small>${pct(h.pct)}</small></div></div><div class="mini-grid"><div><span class="label">Units</span><strong class="number">${num(h.units)}</strong></div><div><span class="label">Buy price ${h.currency}</span><strong class="number">${num(h.buyPrice)}</strong></div><div><span class="label">Day change</span><strong class="number ${tone(h.dayPct)}">${pct(h.dayPct)}</strong></div></div><div class="label">${esc(h.quote?.source||'Manual / unavailable')} · ${esc(h.quote?.date||h.buyDate)}</div><div class="actions"><button data-detail="${esc(h.id)}">Details ↗</button><button data-edit="${esc(h.id)}">Edit</button><button data-sell="${esc(h.id)}">Sell</button><button data-delete="${esc(h.id)}">Delete</button>${h.type==='Other'?`<button data-price="${esc(h.id)}">Update price</button>`:''}</div></article>`).join('')}</div>${!ps.length?'<div class="panel empty"><h2>No matching holdings</h2><p>Add an investment or choose a different filter.</p><button data-action="add">Add investment</button></div>':''}`;}
function concentration(s){return bars(s.positions.map(h=>({label:h.name,value:s.cost?h.cost/s.cost*100:0,color:h.cost/s.cost>.4?'var(--red)':h.cost/s.cost>.2?'var(--gold)':'var(--green)'})),v=>v.toFixed(1)+'%');}
function monthReturns(){const groups={};rows().forEach(r=>(groups[r.date.slice(0,7)]??=[]).push(r));return Object.entries(groups).map(([label,rs])=>({label,value:rs.some(r=>r.value==null)?null:(rs.reduce((n,r)=>n*(1+(r.return||0)),1)-1)*100})).filter(x=>x.value!=null);}
function timeline(d){const map={};d.trades.forEach(t=>map[t.soldDate.slice(0,7)]=(map[t.soldDate.slice(0,7)]||0)+t.pnl);return bars(Object.entries(map).map(([label,value])=>({label,value})))+'<p class="help">Realized gains by sell month. Unrealized monthly movement appears in the monthly return analysis; no extrapolated gains are presented as actual returns.</p>';}
function analytics(d,s){if(!d.lots.length&&!d.trades.length)return heading('Portfolio analytics','Look beyond the headline number.')+empty();const x=C.xirr(C.portfolioFlows(d,s)),months=monthReturns(),category={};s.positions.forEach(h=>category[h.type]=(category[h.type]||0)+(h.pnl||0));const dist=[['< −20%',-Infinity,-20],['−20 to 0%',-20,0],['0 to 20%',0,20],['20 to 50%',20,50],['≥ 50%',50,Infinity]].map(([label,lo,hi])=>({label,value:s.positions.filter(h=>h.pct!=null&&h.pct>=lo&&h.pct<hi).length}));return heading('Portfolio analytics','Understand the return. Understand the risk.')+`<div class="stack"><div class="grid four">${metric('Money-weighted return',pct(x==null?null:x*100),'XIRR · exact cash-flow dates')}${metric('Concentration',s.hhi.toFixed(1),'HHI · lower is more diversified')}${metric('Winning positions',s.positions.filter(h=>h.pnl>0).length+' / '+s.positions.length,'Unrealized gains above zero')}${metric('Realized + income',money(s.realized+s.income),'Closed trades and distributions')}</div>${section('Portfolio growth',`${rangeTabs()}<div class="legend"><span>Portfolio value</span><span>Cost basis</span></div>${lineChart(selectedRows())}<h3>Invested & current value</h3>${s.positions.map(h=>bars([{label:h.name+' · invested',value:h.cost,color:'var(--gold)'},{label:'Current',value:h.value}])).join('')}`)}${section('Returns analysis',`<div class="grid equal"><div><h3>Annualised return · XIRR</h3>${bars(s.positions.map(h=>({label:h.name,value:C.holdingXirr(h)==null?null:C.holdingXirr(h)*100})),pct)}<p class="help">Annualising short holding periods can produce extreme values.</p></div><div><h3>Category P&L</h3>${s.value==null?'<p>Waiting for complete prices.</p>':bars(Object.entries(category).map(([label,value])=>({label,value})))}<h3>Return distribution</h3>${bars(dist,num)}</div></div>`)}${section('Investment behaviour',`<div class="grid equal"><div><h3>Monthly investments</h3>${bars(Object.entries(C.monthlyInvestments(d)).sort().map(([label,value])=>({label,value})))}</div><div><h3>Holding period</h3>${bars([...s.positions].sort((a,b)=>b.age-a.age).map(h=>({label:h.name,value:h.age})),v=>num(v)+' days')}</div></div><h3>Best / worst calendar months · cash-flow adjusted</h3><div class="chips">${[...months].sort((a,b)=>b.value-a.value).slice(0,3).concat([...months].sort((a,b)=>a.value-b.value).slice(0,3)).filter((v,i,a)=>a.findIndex(x=>x.label===v.label)===i).map(m=>`<span class="month-chip">${m.label}<strong class="number ${tone(m.value)}">${pct(m.value)}</strong></span>`).join('')||'<p>Load historical prices to compare months.</p>'}</div>`)}${section('Risk & health',`<div class="grid equal"><div><h3>Concentration · invested capital</h3><div class="risk-number number">${s.hhi.toFixed(0)}<small class="label"> / 100</small></div>${concentration(s)}<h3>Risk exposure heuristic</h3>${bars(s.positions.map(h=>({label:h.name,value:(h.cost/(s.cost||1))*({NSE:80,BSE:80,US:85,MF:55,Gold:40,Silver:65,Other:90}[h.type])*(h.age<365?1:.8)})),v=>v.toFixed(1))}<p class="help">Type and concentration heuristic, not measured volatility or investment advice.</p></div><div><h3>Allocation</h3>${allocation(s.positions)}<h3>Portfolio health · heuristic</h3>${radar([{label:'Return',value:50+(s.pct||0)},{label:'Diversity',value:100-s.hhi},{label:'Hold period',value:s.positions.reduce((n,h)=>n+h.age,0)/(s.positions.length||1)/10},{label:'Win rate',value:s.positions.filter(h=>h.pnl>0).length/(s.positions.length||1)*100},{label:'Size',value:s.positions.length*10}])}</div></div>`)}${section('Profit booking history',timeline(d),false)}</div>`;}
function predictions(d,s){if(!d.lots.length)return heading('Future scenarios','Explore possibilities, with your assumptions in view.')+empty();const ranked=[...s.positions].filter(h=>C.holdingXirr(h)!=null).sort((a,b)=>C.holdingXirr(b)-C.holdingXirr(a)),losses=s.positions.filter(h=>h.pnl<0),stock=s.positions.filter(h=>['NSE','BSE','US'].includes(h.type)).reduce((n,h)=>n+h.cost,0)/(s.cost||1),suggestions=[];if(stock>.6)suggestions.push('Equities are '+(stock*100).toFixed(0)+'% of invested capital. Compare this with your own target allocation.');if(!s.positions.some(h=>h.type==='Gold'||h.type==='Silver'))suggestions.push('No precious-metals exposure. Consider whether this fits your diversification plan.');if(!s.positions.some(h=>h.type==='MF'))suggestions.push('No mutual funds. A diversified fund may be worth researching.');if(!s.positions.some(h=>h.type==='US'))suggestions.push('No direct international positions are recorded. Funds may already provide international exposure.');s.positions.filter(h=>h.cost/s.cost>.4).forEach(h=>suggestions.push(h.name+' represents '+(h.cost/s.cost*100).toFixed(0)+'% of cost basis. Review single-position risk.'));return heading('Future scenarios','A planning space. You set the assumptions.')+`<div class="stack">${section('Build your return scenario',`<div class="row"><div><span class="label">ASSUMED ANNUAL RETURN</span><div class="projection-rate number" id="rate-value">${S.rate}%</div></div><span class="badge">HYPOTHETICAL</span></div><input id="rate" type="range" min="-30" max="80" value="${S.rate}" aria-label="Assumed annual return"><div class="ranges">${[['XIRR',C.xirr(C.portfolioFlows(d,s))*100],['8% FD',8],['12%',12],['15%',15],['20%',20]].map(([l,r])=>`<button data-rate="${Number.isFinite(r)?Math.max(-30,Math.min(80,r)):12}">${l}</button>`).join('')}</div><div class="form-grid"><label>Monthly contribution (₹)<input id="monthly" type="number" min="0" value="${S.monthly}"></label><div><p class="help">Starts from current portfolio value. Bear / Bull use base − 5 / + 5 percentage points, so negative-rate scenarios remain correctly ordered. Contributions arrive at month end.</p></div></div><div id="projections">${projectionTable(s)}</div><p class="help">Nominal amounts, before fees, tax and inflation. Preset rates are assumptions, not current product rates.</p>`)}${section('Break-even illustrations',losses.length?losses.map(h=>`<div class="row"><span>${esc(h.name)}</span><span class="number">${h.change>0?Math.ceil(-h.pnl/h.change)+' trading sessions':'No recovery at latest daily rate'}</span></div>`).join('')+'<p class="help">A mechanical extrapolation of one price change. Not a forecast; daily changes do not persist.</p>':'<p>No losing positions with available prices.</p>')}${section('Allocation review',suggestions.map(t=>`<p>◇ ${esc(t)}</p>`).join('')||'<p>No concentration rules triggered.</p>')}${section('XIRR leaderboard',`<div class="table-wrap"><table><thead><tr><th>Holding</th><th>Annualised</th><th>Days held</th><th>P&L</th></tr></thead><tbody>${ranked.map((h,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1} ${esc(h.name)}</td><td class="number ${tone(h.pnl)}">${pct(C.holdingXirr(h)*100)}</td><td>${num(h.age)}</td><td class="number">${money(h.pnl)}</td></tr>`).join('')}</tbody></table></div>`)}${section('Concentration detail',concentration(s),false)}${section('Profit booking history',timeline(d),false)}</div>`;}
function projectionTable(s){if(s.value==null)return '<p>Complete prices are required for projections.</p>';return `<div class="table-wrap"><table><thead><tr><th>Horizon</th><th>Bear · ${pct(S.rate-5)}</th><th>Base · ${pct(S.rate)}</th><th>Bull · ${pct(S.rate+5)}</th><th>New money</th></tr></thead><tbody>${[1,3,5,10].map(y=>`<tr><td>${y} year${y>1?'s':''}</td>${[S.rate-5,S.rate,S.rate+5].map(r=>`<td class="number">${money(C.project(s.value,r/100,y,S.monthly))}</td>`).join('')}<td class="number">${money(S.monthly*12*y)}</td></tr>`).join('')}</tbody></table></div>`;}
function realized(d,s){const best=[...d.trades].sort((a,b)=>b.pnl-a.pnl)[0],win=d.trades.filter(t=>t.pnl>0).length;return heading('Realized gains','The returns you have brought home.',`<button data-action="dividend">＋ Record income</button>`)+`<div class="stack"><div class="grid four">${metric('Total realized',money(s.realized),'After recorded sale fees',tone(s.realized))}${metric('Closed trades',d.trades.length,'Includes partial sales')}${metric('Best trade',best?money(best.pnl):'—',esc(best?.name||''),tone(best?.pnl))}${metric('Win rate',d.trades.length?(win/d.trades.length*100).toFixed(1)+'%':'—',win+' profitable trades')}</div><div class="grid equal"><article class="panel"><h3>Profit booking timeline</h3>${timeline(d)}</article><article class="panel"><h3>P&L by trade</h3>${bars(d.trades.map(t=>({label:t.name,value:t.pnl})))}<h3>Trade outcomes</h3>${bars([{label:'Profitable',value:win},{label:'Loss',value:d.trades.filter(t=>t.pnl<0).length,color:'var(--red)'},{label:'Break-even',value:d.trades.filter(t=>t.pnl===0).length}],num)}</article></div><article class="panel"><h3>Closed positions</h3><div class="table-wrap"><table><thead><tr><th>Asset / sale date</th><th>Units</th><th>Buy → sell</th><th>Net proceeds</th><th>P&L</th></tr></thead><tbody>${[...d.trades].sort((a,b)=>b.soldDate.localeCompare(a.soldDate)).map(t=>`<tr><td>${esc(t.name)}<br><small class="muted">${t.soldDate} · ${esc(t.notes||'')}</small></td><td class="number">${num(t.units)}</td><td class="number">${num(t.buyPrice)} → ${num(t.soldPrice)} ${t.currency}</td><td class="number">${money(t.proceeds)}</td><td class="number ${tone(t.pnl)}">${money(t.pnl)}<br>${pct(t.pnl/t.cost*100)}</td></tr>`).join('')}</tbody></table></div>${!d.trades.length?'<p>No sales yet. Record a sale from Holdings.</p>':''}</article>${d.dividends.length?'<article class="panel"><h3>Income received</h3>'+bars(d.dividends.map(e=>({label:e.date+' · '+e.name,value:e.amount})))+'</article>':''}</div>`;}
function bindMain(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{S.range=b.dataset.range;render();});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render();});for(const a of ['edit','sell','delete','price'])document.querySelectorAll('[data-'+a+']').forEach(b=>b.onclick=()=>({edit:add,sell,delete:remove,price:updatePrice}[a])(b.dataset[a]));if($('#holding-search'))$('#holding-search').oninput=e=>{S.query=e.target.value;const pos=e.target.selectionStart;render();$('#holding-search').focus();$('#holding-search').setSelectionRange(pos,pos);};if($('#rate'))$('#rate').oninput=e=>{S.rate=+e.target.value;$('#rate-value').textContent=S.rate+'%';$('#projections').innerHTML=projectionTable(stats());};if($('#monthly'))$('#monthly').oninput=e=>{S.monthly=Math.max(0,+e.target.value||0);$('#projections').innerHTML=projectionTable(stats());};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{S.rate=Math.round(+b.dataset.rate*10)/10;render();});}
function action(a){({settings,connect,demo,add,performance,dividend,'exit-demo':()=>{S.demo=false;clearData();render();}}[a]||(()=>{}))();}
function clearData(){S.events=[];S.prices={};S.histories={};S.fxHistory={};S.fx=null;S.errors=[];S.lastSync=null;}
async function connect(){if(S.busy)return;if(cloud.user){cloud.disconnect();clearData();render();return;}S.busy=true;status();try{await cloud.connect();S.demo=false;clearData();await sync();toast('Connected. Your portfolio follows your Google account.');}catch(e){toast(e.message);}finally{S.busy=false;render();}if(cloud.user)await refresh();}
async function sync(){if(!cloud.user)return;S.events=await cloud.load(S.events);const setting=[...S.events].filter(e=>e.kind==='settings').sort((a,b)=>a.at.localeCompare(b.at)||a.id.localeCompare(b.id)).at(-1);if(setting){Object.assign(prefs,{priceService:setting.values.priceService,goldDuty:setting.values.goldDuty,silverDuty:setting.values.silverDuty});market.url=prefs.priceService||'';localStorage.setItem('portfolio-v2-prefs',JSON.stringify(prefs));}S.lastSync=Date.now();status();}
async function commit(event){if(S.busy)throw Error('Please wait for the current operation.');if(!S.demo&&!cloud.user)throw Error('Connect Google before saving your investments.');S.busy=true;status();const e={...event,id:crypto.randomUUID(),at:new Date().toISOString()};try{if(!S.demo)await sync();const next=C.replay([...S.events,e]);const fail=next.conflicts.find(c=>c.event.id===e.id);if(fail)throw Error(fail.error);if(!S.demo)await cloud.append(e);S.events.push(e);S.lastSync=Date.now();render();return e;}finally{S.busy=false;status();}}
async function refresh(){if(S.busy)return;S.busy=true;status();try{if(!S.demo){await sync();const q=await market.quotes(state().lots);S.prices=q.prices;S.fx=q.fx;S.errors=q.errors;await loadHistory();}render();toast(S.errors.length?'Updated with some unavailable prices.':'Portfolio refreshed.');}catch(e){toast(e.message);}finally{S.busy=false;status();}}
async function loadHistory(){S.historyLoading=true;const d=state(),hs=[...new Map([...d.lots,...d.trades].map(h=>[h.symbol,h])).values()];if(hs.some(h=>h.currency==='USD'))hs.push({symbol:'INR=X',type:'FX'});for(let i=0;i<hs.length;i+=4){await Promise.all(hs.slice(i,i+4).map(async h=>{try{const j=await market.history(h);if(h.symbol==='INR=X')S.fxHistory=j.series;else S.histories[h.symbol]=j.series;}catch(e){if(!S.errors.includes(e.message))S.errors.push(e.message);}}));}S.historyLoading=false;}

function settings(){const d=state();modal('Settings & data',`<div class="stack"><section><h3>Your Google account</h3><p class="help">${esc(cloud.user?.email||'Not connected')}. Your transactions live in private Google Drive app storage and are loaded on every device after sign-in. Access tokens stay in memory and expire within one hour.</p><button id="settings-connect">${cloud.user?'Sign out':'Connect Google'}</button> <button id="settings-theme">Switch appearance</button><p class="help">First-time setup: enable the Drive API and the drive.appdata OAuth scope in your Google Cloud project. <button type="button" class="chip" data-setup-guide>Read setup guide ↗</button></p></section><section><h3>Market-data service</h3><label>Apps Script deployment URL<input id="service-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(market.url)}"></label><p class="help">This service fetches public quotes and histories. Portfolio holdings, notes and Google access tokens are never sent to it.</p><div class="form-grid"><label>Gold conversion uplift (%)<input id="gold-duty" type="number" min="0" max="100" step="0.01" value="${prefs.goldDuty??9.75}"></label><label>Silver conversion uplift (%)<input id="silver-duty" type="number" min="0" max="100" step="0.01" value="${prefs.silverDuty??6}"></label></div><p class="help">User assumptions, not verified tax rates. International futures are indicative and may differ from local retail prices. Multipliers: <span id="duty-preview"></span></p><div class="actions"><button id="test-service">Test connection</button><button id="save-service" class="primary">Save & refresh</button><button id="copy-script">Copy price-service script</button></div></section><section><h3>Backups & migration</h3><p class="help">Import a PORTFOL.IO v2 JSON backup or a legacy holdings JSON array. Imports are previewed and validated before saving. Existing legacy Sheets are not modified.</p><div class="actions"><button id="export-backup">Export JSON backup</button><button id="export-csv">Export holdings CSV</button><button id="legacy-local">Import legacy browser data</button><button id="legacy-cloud">Read legacy Sheets URL</button></div><label>Import JSON file<input id="import-file" type="file" accept=".json,application/json"></label><div id="import-preview"></div></section><section><h3>Sync & audit</h3><p class="help">${S.events.length} immutable events · ${d.conflicts.length} conflicts. Sync refreshes when you return to the app and every minute while signed in. Conflicting edits are excluded and kept in backups for review.</p>${d.conflicts.map(c=>`<div class="notice">${esc(c.event.kind)} · ${esc(c.event.at)}<br>${esc(c.error)}<br>Event ${esc(c.event.id)}</div>`).join('')}<p class="help">No trading orders are placed by this app. Data can be removed permanently by deleting this app's hidden data from Google Drive settings.</p></section></div>`);$('#settings-connect').onclick=()=>{$('#modal').close();connect();};$('#settings-theme').onclick=()=>theme(prefs.theme==='dark'?'light':'dark');const preview=()=>$('#duty-preview').textContent=(1+(+$('#gold-duty').value)/100).toFixed(4)+'× gold · '+(1+(+$('#silver-duty').value)/100).toFixed(4)+'× silver';$('#gold-duty').oninput=preview;$('#silver-duty').oninput=preview;preview();$('#test-service').onclick=async()=>{const m=new Market($('#service-url').value.trim());try{const r=await m.api('health');toast(r.ok?'Price service connected.':'Invalid service response.');}catch(e){toast(e.message);}};$('#save-service').onclick=async()=>{const u=$('#service-url').value.trim(),g=+$('#gold-duty').value,si=+$('#silver-duty').value;if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u))return toast('Enter a valid deployed Apps Script /exec URL.');if(!Number.isFinite(g)||!Number.isFinite(si)||g<0||si<0||g>100||si>100)return toast('Conversion assumptions must be between 0 and 100%.');if(cloud.user){try{await commit({kind:'settings',values:{priceService:u,goldDuty:g,silverDuty:si}});}catch(e){toast(e.message);return;}}prefs.priceService=u;prefs.goldDuty=g;prefs.silverDuty=si;localStorage.setItem('portfolio-v2-prefs',JSON.stringify(prefs));market.url=u;$('#modal').close();refresh();};$('#copy-script').onclick=async()=>{try{await navigator.clipboard.writeText(PRICE_SERVICE_SOURCE);toast('Price-service script copied.');}catch{download('PriceService.gs',PRICE_SERVICE_SOURCE,'text/plain');}};$('#export-backup').onclick=exportData;$('#export-csv').onclick=()=>{const cell=x=>'"'+String(x??'').replace(/^([=+@-])/,'\t$1').replaceAll('"','""')+'"';download('portfolio-holdings.csv',[['name','type','symbol','units','buyPrice','buyDate','buyFx','currency','costINR','valueINR'],...stats().positions.map(h=>[h.name,h.type,h.symbol,h.units,h.buyPrice,h.buyDate,h.buyFx,h.currency,h.cost,h.value])].map(r=>r.map(cell).join(',')).join('\n'),'text/csv');};$('#import-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error('File is too large (10 MB maximum).');previewImport(JSON.parse(await f.text()));}catch(e){toast(e.message);}};$('#legacy-local').onclick=()=>{try{const raw=JSON.parse(localStorage.getItem('pf_data')||'null');if(!raw)throw Error('No legacy data found in this browser. Export from your old app or use its Sheets URL.');previewImport(raw);}catch(e){toast(e.message);}};$('#legacy-cloud').onclick=()=>{const box=$('#import-preview');box.innerHTML='<label>Existing Apps Script URL<input id="legacy-url" type="url" value="'+esc(localStorage.getItem('pf_url')||'')+'"></label><button id="read-legacy">Read holdings (no changes)</button>';$('#read-legacy').onclick=async()=>{try{const url=$('#legacy-url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url))throw Error('Use your deployed Apps Script URL.');const r=await fetch(url,{signal:AbortSignal.timeout(30000)}),j=await r.json();previewImport(j.data);}catch(e){toast(e.message);}};};}
function previewImport(raw){try{let events,description;if(raw?.schema===2&&Array.isArray(raw.events)){if(raw.events.length>10000)throw Error('Import is too large.');if(raw.events.some(e=>!e.id||!e.at||!Number.isFinite(Date.parse(e.at))))throw Error('Invalid event identifiers or timestamps.');const ids=new Set(S.events.map(e=>e.id));events=raw.events.filter(e=>!ids.has(e.id));const check=C.replay([...S.events,...events]);if(check.conflicts.length>state().conflicts.length)throw Error('Import contains invalid or conflicting transactions. Resolve them before importing.');description=events.length+' new audit events';}else{const imported=C.normalizeLegacy(raw),ids=new Set(state().lots.map(h=>h.id));imported.lots=imported.lots.filter(h=>!ids.has(h.id));const tradeIds=new Set(state().trades.map(t=>t.id));imported.trades=imported.trades.filter(t=>!tradeIds.has(t.id));events=[{id:crypto.randomUUID(),at:new Date().toISOString(),kind:'batch',...imported}];description=imported.lots.length+' active positions and '+imported.trades.length+' closed trades';}$('#import-preview').innerHTML='<div class="notice"><strong>Ready to import:</strong> '+esc(description)+'. Review your exported source before confirming. Existing entries are preserved.</div><button id="confirm-import" class="primary">Confirm import</button>';$('#confirm-import').onclick=async()=>{if(!requireAccount()||S.busy)return;S.busy=true;status();try{if(!S.demo)await sync();for(const e of events){if(S.events.some(x=>x.id===e.id))continue;if(!S.demo)await cloud.append(e);S.events.push(e);}$('#modal').close();render();toast('Import saved. Export a backup before making further changes.');}catch(e){toast('Import paused: '+e.message+'. Retry the same file to continue without duplicates.');}finally{S.busy=false;status();}};}catch(e){toast(e.message);}}
// Convert international metal futures to indicative INR/gram, consistently for live and history.
const originalQuotes=market.quotes.bind(market),originalHistory=market.history.bind(market);
market.quotes=async lots=>{const q=await originalQuotes(lots);for(const h of [...new Map(lots.filter(h=>['Gold','Silver'].includes(h.type)).map(h=>[h.symbol,h])).values()]){const p=q.prices[h.symbol],fx=q.fx;if(p&&fx){const factor=fx/31.1034768*(1+(h.type==='Gold'?prefs.goldDuty??9.75:prefs.silverDuty??6)/100);q.prices[h.symbol]={...p,price:p.price*factor,previous:p.previous==null?null:p.previous*factor,source:'Indicative futures · INR/gram'};}else delete q.prices[h.symbol];}return q;};
market.history=async h=>{const j=await originalHistory(h);if(['Gold','Silver'].includes(h.type)){const fx=await originalHistory({symbol:'INR=X',type:'FX'}),dates=Object.keys(fx.series).sort(),out={};let index=0,last=null;for(const [date,p]of Object.entries(j.series).sort()){while(index<dates.length&&dates[index]<=date){last=fx.series[dates[index++]];}if(last)out[date]=p*last/31.1034768*(1+(h.type==='Gold'?prefs.goldDuty??9.75:prefs.silverDuty??6)/100);}j.series=out;}return j;};
$('#settings').onclick=settings;$('#signin').onclick=connect;$('#add').onclick=()=>add();$('#refresh').onclick=refresh;window.addEventListener('hashchange',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.user&&!S.busy)refresh();});setInterval(()=>{if(!document.hidden&&cloud.user&&!S.busy)refresh();},60000);render();

// Agent-accessible inspection and navigation use the same visible state and account gate.
if(document.modelContext?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});for(const tool of [{name:'read_portfolio_summary',description:'Read the currently connected or explicitly selected demo portfolio summary. Does not connect accounts or place trades.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(input&&Object.keys(input).length)throw Error('No parameters expected.');if(!S.demo&&!cloud.user)throw Error('Connect Google or open demo mode first.');const s=stats();return {demo:S.demo,currency:'INR',invested:s.cost,value:s.value,unrealized:s.pnl,realized:s.realized,income:s.income,positions:s.positions.length,conflicts:state().conflicts.length};}},{name:'open_portfolio_view',description:'Navigate to an existing portfolio view. Does not change financial records.',inputSchema:{type:'object',properties:{view:{type:'string',enum:Object.keys(names)}},required:['view'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='view')||!Object.hasOwn(names,input.view))throw Error('Unknown portfolio view.');location.hash=input.view;render();return {view:input.view};}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}

document.addEventListener("click",e=>{if(e.target.closest("[data-setup-guide]")){modal("Setup & feature notes",'<pre style="white-space:pre-wrap;font:inherit">'+esc(SETUP_GUIDE)+'</pre><button id="download-service">Download price-service script</button>',true);document.querySelector("#download-service").onclick=()=>download("PriceService.gs",PRICE_SERVICE_SOURCE,"text/plain");}});

</script></body></html>
